<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<meta property="og:title" content="Công nợ TAPHOA">
<meta property="og:type" content="website">
<title>Công nợ TAPHOA</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#171717;background:#f6f7f8;font-size:16px;--order-stt-cap:3.4ch;--order-price-cap:5.4ch;--order-qty-cap:3.4ch;--order-money-cap:6.4ch;--order-col-gap:8px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f7f8;color:#171717}
body{padding:0 0 max(20px,env(safe-area-inset-bottom))}
main{width:min(760px,100%);margin:0 auto;padding:14px}
.head{padding:4px 2px 12px}.brand{font-size:12px;font-weight:700;letter-spacing:.08em;color:#6b7280}.title{margin:6px 0 2px;font-size:24px;line-height:1.2}.customer{font-size:15px;color:#4b5563}
.balance{margin-top:10px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(15,23,42,.04)}
.balance-label{font-size:13px;color:#6b7280}.balance-value{margin-top:4px;font-size:30px;line-height:1.1;font-weight:750;letter-spacing:-.03em}.balance-value[data-state="debt"]{color:#b42318}.balance-value[data-state="credit"]{color:#087a55}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px}.stat span{display:block;font-size:12px;color:#6b7280}.stat strong{display:block;margin-top:4px;font-size:17px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 2px 9px}.section-head h2{margin:0;font-size:16px}.updated{font-size:11px;color:#9ca3af}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px}.filter{flex:0 0 auto;border:1px solid #d8dde4;background:#fff;color:#4b5563;border-radius:999px;height:34px;padding:0 12px;font:600 12px inherit}.filter[data-active="true"]{background:#171717;color:#fff;border-color:#171717}
.timeline{display:grid;gap:8px}.entry{width:100%;text-align:left;border:1px solid #e5e7eb;background:#fff;border-radius:14px;padding:12px 13px;color:inherit;font:inherit}.entry[disabled]{cursor:default}.entry-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}.entry-title{font-size:15px;font-weight:650;line-height:1.3}.entry-amount{font-size:15px;font-weight:700;white-space:nowrap}.entry-meta{margin-top:4px;font-size:12px;color:#6b7280}.entry-bottom{display:flex;justify-content:space-between;gap:10px;margin-top:9px;padding-top:9px;border-top:1px solid #f0f1f2;font-size:12px;color:#6b7280}.entry-balance{font-weight:650;color:#374151}.entry[data-clickable="true"]{cursor:pointer}.entry[data-clickable="true"]:active{transform:scale(.995)}
.empty,.error{margin-top:24px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;text-align:center;color:#6b7280}.error strong{display:block;color:#111827;margin-bottom:7px}
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;background:rgba(17,24,39,.5);backdrop-filter:blur(3px)}
.sheet[data-open="true"]{display:flex}
.sheet-card{width:100%;height:85dvh;max-height:85dvh;overflow:hidden;background:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -18px 45px rgba(15,23,42,.18)}
.grab-wrap{height:26px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}.grab{width:48px;height:6px;border-radius:999px;background:#e5e7eb}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px 12px;border-bottom:1px solid #f1f5f9;flex:none;background:#fff}.sheet-head-title{display:flex;align-items:center;gap:8px;min-width:0}.receipt-icon{width:31px;height:31px;border-radius:9px;background:#ecfdf3;color:#16a34a;display:flex;align-items:center;justify-content:center;flex:none}.receipt-icon svg{width:18px;height:18px;display:block}.sheet-head h3{margin:0;font-size:16px;line-height:1.25;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sheet-close{width:32px;height:32px;border:0;border-radius:999px;background:#f8fafc;color:#64748b;font-size:22px;line-height:32px;text-align:center;padding:0;flex:none}
.order-detail-content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#fff}.order-meta{padding:12px 20px;background:#f8fafc;border-bottom:1px solid #f1f5f9;flex:none}.order-code{margin:0;font-size:11px;font-weight:600;color:#9ca3af}.order-customer{margin:4px 0 0;font-size:14px;line-height:1.3;font-weight:750;color:#1f2937}.order-time{margin:4px 0 0;font-size:11px;color:#6b7280}
.order-table-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff}.order-detail-grid{display:grid;width:100%;grid-template-columns:var(--order-stt-cap) minmax(0,1fr) var(--order-price-cap) var(--order-qty-cap) var(--order-money-cap);column-gap:var(--order-col-gap);align-items:center;min-width:0}.order-detail-grid>*{min-width:0}.order-head{position:sticky;top:0;z-index:2;padding:8px 14px;border-bottom:1px solid #f3f4f6;background:#fff;color:#9ca3af;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.04em}.order-stt{text-align:center;font-variant-numeric:tabular-nums}.order-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.order-price,.order-qty,.order-total{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.order-items{padding:0 14px}.order-row{min-height:42px;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:12px;color:#374151}.order-row:last-child{border-bottom:0}.order-row .order-stt{font-weight:700;color:#9ca3af}.order-row .order-name{font-weight:750;color:#111827;line-height:1.3}.order-row .order-price{font-weight:600}.order-row .order-qty{font-weight:700}.order-row .order-total{font-weight:800;color:#111827}.order-line-note{margin-top:2px;font-size:10px;line-height:1.25;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-summary{padding:14px 20px 16px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex:none;background:#fff}.summary-label{font-size:12px;font-weight:500;color:#9ca3af}.summary-value{margin-top:3px;font-size:15px;font-weight:750;color:#111827}.summary-total{text-align:right}.summary-total .summary-value{font-size:20px;font-weight:850;color:#16a34a;font-variant-numeric:tabular-nums;white-space:nowrap}.order-detail-error{padding:24px 10px;text-align:center;color:#6b7280;font-size:13px}
.loading{padding:28px;text-align:center;color:#6b7280}
[hidden]{display:none!important}
@media (min-width:760px){main{padding:24px}.sheet{align-items:center;justify-content:center}.sheet-card{width:min(720px,calc(100vw - 48px));height:min(760px,82vh);max-height:82vh;border-radius:24px}.title{font-size:28px}.order-head,.order-items{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<main>
  <header class="head" id="head" hidden>
    <div class="brand">TAPHOA · CÔNG NỢ</div>
    <h1 class="title">Công nợ</h1>
    <div class="customer" id="customer"></div>
    <section class="balance">
      <div class="balance-label" id="balance-label">Số tiền còn nợ</div>
      <div class="balance-value" id="balance-value"></div>
    </section>
    <section class="stats">
      <div class="stat"><span>Đã giao</span><strong id="total-delivered"></strong></div>
      <div class="stat"><span>Đã thu</span><strong id="total-collected"></strong></div>
    </section>
  </header>
  <section id="content">
    <div class="loading" id="loading">Đang tải công nợ…</div>
    <div class="error" id="error" hidden><strong>Không mở được công nợ</strong><span>Kiểm tra lại liên kết được gửi từ TAPHOA.</span></div>
    <div id="history" hidden>
      <div class="section-head"><h2>Lịch sử giao dịch</h2><span class="updated" id="updated"></span></div>
      <div class="filters">
        <button class="filter" type="button" data-filter="all" data-active="true">Tất cả</button>
        <button class="filter" type="button" data-filter="orders">Đơn hàng</button>
        <button class="filter" type="button" data-filter="collections">Thu tiền</button>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
</main>
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Chi tiết đơn">
    <div class="grab-wrap" id="sheet-grab"><div class="grab"></div></div>
    <div class="sheet-head">
      <div class="sheet-head-title">
        <span class="receipt-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg></span>
        <h3 id="sheet-title">Chi tiết đơn</h3>
      </div>
      <button class="sheet-close" id="sheet-close" type="button" aria-label="Đóng">×</button>
    </div>
    <div class="order-detail-content">
      <div class="order-meta">
        <p class="order-code" id="sheet-order-code">Mã đơn: --</p>
        <p class="order-customer" id="sheet-customer">Khách hàng</p>
        <p class="order-time" id="sheet-meta">Thời gian: --</p>
      </div>
      <div class="order-table-scroll">
        <div class="order-detail-grid order-head">
          <div class="order-stt">#</div>
          <div class="order-name">TÊN SP</div>
          <div class="order-price">Đ.GIÁ</div>
          <div class="order-qty">SL</div>
          <div class="order-total">T.TIỀN</div>
        </div>
        <div class="order-items" id="sheet-body"></div>
      </div>
      <div class="order-summary">
        <div>
          <div class="summary-label">Số lượng</div>
          <div class="summary-value"><span id="sheet-line-count">0</span> mã · <span id="sheet-total-qty">0</span> sản phẩm</div>
        </div>
        <div class="summary-total">
          <div class="summary-label">Tổng thanh toán</div>
          <div class="summary-value" id="sheet-total">0</div>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
(function(){
'use strict';
var API='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/taphoa-public-debt';
var params=new URLSearchParams(location.search);
var customerSlug=params.get('kh')||'';
var els={
  head:document.getElementById('head'),customer:document.getElementById('customer'),
  balanceLabel:document.getElementById('balance-label'),balanceValue:document.getElementById('balance-value'),
  delivered:document.getElementById('total-delivered'),collected:document.getElementById('total-collected'),
  loading:document.getElementById('loading'),error:document.getElementById('error'),history:document.getElementById('history'),
  updated:document.getElementById('updated'),timeline:document.getElementById('timeline'),
  sheet:document.getElementById('sheet'),sheetTitle:document.getElementById('sheet-title'),
  sheetOrderCode:document.getElementById('sheet-order-code'),sheetCustomer:document.getElementById('sheet-customer'),
  sheetMeta:document.getElementById('sheet-meta'),sheetBody:document.getElementById('sheet-body'),sheetClose:document.getElementById('sheet-close'),
  sheetLineCount:document.getElementById('sheet-line-count'),sheetTotalQty:document.getElementById('sheet-total-qty'),sheetTotal:document.getElementById('sheet-total'),
  sheetGrab:document.getElementById('sheet-grab')
};
var data=null,activeFilter='all';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(v){var n=Math.abs(Number(v)||0)/1000;return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:3}).format(n);}
function moneyNumber(v){var n=Math.abs(Number(v)||0)/1000;return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:3}).format(n);}
function time(v){if(!v)return'';try{return new Date(v).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});}catch(e){return'';}}
function qty(v){var n=Number(v)||0;return Number.isInteger(n)?String(n):String(n).replace(/0+$/,'').replace(/\.$/,'');}
function balanceText(v){var n=Math.round(Number(v)||0);if(n>0)return{label:'Còn nợ',text:money(n),state:'debt'};if(n<0)return{label:'Còn dư',text:money(n),state:'credit'};return{label:'Đã hết nợ',text:'0',state:'zero'};}
function typeLabel(row){if(row.entry_type==='sale')return row.order&&row.order.display_code?'Đơn '+row.order.display_code+' đã giao':'Đơn đã giao';if(row.entry_type==='collection')return'Đã thu tiền';if(row.entry_type==='payment')return'Thanh toán';return'Điều chỉnh công nợ';}
function visible(row){if(activeFilter==='orders')return row.entry_type==='sale';if(activeFilter==='collections')return row.entry_type==='collection';return true;}
function render(){
  if(!data)return;
  var b=balanceText(data.balance_vnd);
  els.customer.textContent=(data.customer&&data.customer.display_name)||'Khách hàng';
  els.balanceLabel.textContent=b.label;els.balanceValue.textContent=b.text;els.balanceValue.dataset.state=b.state;
  els.delivered.textContent=money(data.total_delivered_vnd);els.collected.textContent=money(data.total_collected_vnd);
  els.updated.textContent=data.generated_at?'Cập nhật '+time(data.generated_at):'';
  document.title='Công nợ '+((data.customer&&data.customer.display_name)||'')+' · TAPHOA';
  var rows=(data.entries||[]).filter(visible);
  els.timeline.innerHTML=rows.map(function(row){
    var clickable=!!(row.order&&row.order.id&&row.entry_type==='sale');
    var rb=balanceText(row.balance_after_vnd);
    var amount=row.entry_type==='collection'?'-'+money(row.amount_vnd):(row.amount_vnd>0?'+'+money(row.amount_vnd):'-'+money(row.amount_vnd));
    return '<button class="entry" type="button" '+(clickable?'data-clickable="true" data-order="'+esc(row.order.id)+'"':'disabled')+'>'+
      '<div class="entry-top"><div><div class="entry-title">'+esc(typeLabel(row))+'</div><div class="entry-meta">'+esc(time(row.created_at))+(row.note?' · '+esc(row.note):'')+'</div></div><div class="entry-amount">'+esc(amount)+'</div></div>'+
      '<div class="entry-bottom"><span>'+(clickable?'Xem chi tiết đơn':'')+'</span><span class="entry-balance">'+esc(rb.label)+': '+esc(rb.text)+'</span></div></button>';
  }).join('')||'<div class="empty">Chưa có giao dịch trong mục này.</div>';
}
function fail(){els.loading.hidden=true;els.head.hidden=true;els.history.hidden=true;els.error.hidden=false;}
function closeSheet(){els.sheet.dataset.open='false';els.sheet.setAttribute('aria-hidden','true');els.sheetBody.innerHTML='';}
async function openOrder(orderId,sourceRow){
  els.sheet.dataset.open='true';els.sheet.setAttribute('aria-hidden','false');
  var sourceCode=sourceRow&&sourceRow.order&&sourceRow.order.display_code?sourceRow.order.display_code:'';
  els.sheetTitle.textContent=sourceCode||'Chi tiết đơn';
  els.sheetOrderCode.textContent='Mã đơn: '+(sourceCode||'--');
  els.sheetCustomer.textContent=(data&&data.customer&&data.customer.display_name)||'Khách hàng';
  els.sheetMeta.textContent='Thời gian: Đang tải…';
  els.sheetBody.innerHTML='<div class="order-detail-error">Đang tải chi tiết đơn…</div>';
  els.sheetLineCount.textContent='0';els.sheetTotalQty.textContent='0';els.sheetTotal.textContent='0';
  try{
    var res=await fetch(API+'?kh='+encodeURIComponent(customerSlug)+'&order='+encodeURIComponent(orderId),{cache:'no-store'});
    if(!res.ok)throw new Error('load_failed');
    var detail=await res.json(),o=detail.order||{},rows=Array.isArray(o.items)?o.items:[];
    var code=o.display_code||sourceCode||'--';
    els.sheetTitle.textContent=code;
    els.sheetOrderCode.textContent='Mã đơn: '+code;
    els.sheetCustomer.textContent=(detail.customer&&detail.customer.display_name)||(data&&data.customer&&data.customer.display_name)||'Khách hàng';
    els.sheetMeta.textContent='Thời gian: '+(time(o.delivered_at||o.created_at)||'--');
    var totalQty=0;
    els.sheetBody.innerHTML=rows.map(function(item,index){
      totalQty+=Number(item.qty)||0;
      return '<div class="order-detail-grid order-row">'+
        '<div class="order-stt">'+esc(index+1)+'</div>'+
        '<div><div class="order-name">'+esc(item.product_name||item.product_code||'Sản phẩm')+'</div>'+
          (item.note?'<div class="order-line-note">'+esc(item.note)+'</div>':'')+'</div>'+
        '<div class="order-price">'+esc(moneyNumber(item.unit_price_vnd))+'</div>'+
        '<div class="order-qty">'+esc(qty(item.qty))+'</div>'+
        '<div class="order-total">'+esc(moneyNumber(item.line_total_vnd))+'</div>'+
      '</div>';
    }).join('')||'<div class="order-detail-error">Đơn không có sản phẩm.</div>';
    els.sheetLineCount.textContent=String(rows.length);
    els.sheetTotalQty.textContent=qty(totalQty);
    els.sheetTotal.textContent=moneyNumber(o.total_vnd);
  }catch(e){
    els.sheetMeta.textContent='Thời gian: --';
    els.sheetBody.innerHTML='<div class="order-detail-error"><strong>Không tải được chi tiết đơn</strong></div>';
  }
}
els.sheetClose.addEventListener('click',closeSheet);
els.sheetGrab.addEventListener('click',closeSheet);
els.sheet.addEventListener('click',function(e){if(e.target===els.sheet)closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
document.querySelector('.filters').addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-filter]');if(!b)return;activeFilter=b.dataset.filter||'all';document.querySelectorAll('[data-filter]').forEach(function(x){x.dataset.active=String(x===b);});render();});
els.timeline.addEventListener('click',function(e){var row=e.target.closest&&e.target.closest('[data-order]');if(!row)return;var source=(data&&data.entries||[]).find(function(x){return String(x.order&&x.order.id||'')===String(row.dataset.order||'')&&x.entry_type==='sale';});openOrder(row.dataset.order,source);});
if(!customerSlug){fail();return;}
fetch(API+'?kh='+encodeURIComponent(customerSlug),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('load_failed');return r.json();})
  .then(function(payload){if(!payload||!payload.ok||!payload.customer)throw new Error('invalid');data=payload;els.loading.hidden=true;els.error.hidden=true;els.head.hidden=false;els.history.hidden=false;render();})
  .catch(fail);
})();
</script>
</body>
</html>
