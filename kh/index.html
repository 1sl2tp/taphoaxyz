<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>TAPHOA</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#171717;background:#f3f4f6}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:20px;background:#f3f4f6}
.pin{width:min(360px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px;box-shadow:0 12px 36px rgba(15,23,42,.08)}
h1{margin:0;font-size:20px}p{margin:7px 0 18px;color:#667085;font-size:13px;line-height:1.45}
input{width:100%;height:52px;border:1px solid #d0d5dd;border-radius:14px;text-align:center;font-size:22px;font-weight:800;letter-spacing:.28em;padding-left:.28em;outline:none}
input:focus{border-color:#171717}button{width:100%;height:48px;margin-top:12px;border:0;border-radius:14px;background:#171717;color:#fff;font-size:14px;font-weight:800}
button:disabled{opacity:.55}.error{min-height:18px;margin-top:10px;color:#b42318;font-size:12px;text-align:center}
</style>
</head>
<body>
<form class="pin" id="pinForm">
  <h1>TAPHOA</h1>
  <p>Nhập mã PIN để mở thông tin của bạn.</p>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" aria-label="Mã PIN" placeholder="••••••" autofocus>
  <button id="submit" type="submit">Tiếp tục</button>
  <div class="error" id="error"></div>
</form>
<script>
(()=>{
'use strict';
const SUPABASE='https://gcnoahqsrquxkwkjbuxy.supabase.co';
const KEY='sb_publishable_UY3gfQ9MsntDFCUJ_uV0UA__eTYXz_w';
const STORE='taphoa.public.link.v1';
const params=new URLSearchParams(location.search);
const kh=String(params.get('kh')||'').trim().toLowerCase();
const form=document.getElementById('pinForm');
const input=document.getElementById('pin');
const button=document.getElementById('submit');
const error=document.getElementById('error');

function rootUrl(){
  return '/?'+params.toString();
}
function stored(){
  try{return JSON.parse(sessionStorage.getItem(STORE)||'null')}catch{return null}
}
const old=stored();
if(kh&&old?.kh===kh&&old?.pin){
  location.replace(rootUrl());
  return;
}
if(!kh){
  error.textContent='Liên kết không hợp lệ.';
  input.disabled=true;button.disabled=true;
  return;
}
input.addEventListener('input',()=>{input.value=String(input.value||'').replace(/\D/g,'').slice(0,6);error.textContent='';});
form.addEventListener('submit',async event=>{
  event.preventDefault();
  const pin=String(input.value||'').trim();
  if(!/^\d{6}$/.test(pin)){error.textContent='PIN gồm 6 chữ số.';return;}
  button.disabled=true;button.textContent='Đang kiểm tra…';error.textContent='';
  try{
    const response=await fetch(SUPABASE+'/rest/v1/rpc/taphoa_public_pin_check',{
      method:'POST',
      headers:{'content-type':'application/json','apikey':KEY},
      body:JSON.stringify({p_public_slug:kh,p_pin:pin})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data?.ok!==true)throw new Error(String(data?.error||'pin_invalid'));
    sessionStorage.setItem(STORE,JSON.stringify({kh,pin}));
    location.replace(rootUrl());
  }catch(err){
    const code=String(err?.message||'');
    error.textContent=code.includes('locked')?'PIN đang tạm khóa. Thử lại sau.':'PIN không đúng.';
    button.disabled=false;button.textContent='Tiếp tục';
    input.select();
  }
});
})();
</script>
</body>
</html>
