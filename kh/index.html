<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>TAPHOA</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#171717;background:#f3f4f6}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:20px;background:#f3f4f6}
.card{width:min(380px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px;box-shadow:0 12px 36px rgba(15,23,42,.08)}
h1{margin:0;font-size:20px}p{margin:7px 0 18px;color:#667085;font-size:13px;line-height:1.5}
input{width:100%;height:50px;border:1px solid #d0d5dd;border-radius:14px;font-size:16px;font-weight:650;padding:0 14px;outline:none;background:#fff}
input:focus{border-color:#171717}
.pin-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pin-digit{width:100%;min-width:0;height:52px;padding:0;border:1px solid #d0d5dd;border-radius:12px;background:#fff;text-align:center;font-size:22px;font-weight:800;line-height:1;color:#111827;caret-color:#111827}
.pin-digit:focus{border-color:#111827;box-shadow:0 0 0 2px rgba(17,24,39,.08)}
.pin-grid[data-invalid="true"] .pin-digit{border-color:#f04438;background:#fffafa}
.pin-grid[data-complete="true"] .pin-digit{border-color:#98a2b3}
button{width:100%;height:48px;margin-top:12px;border:0;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer}
button:disabled{opacity:.42;cursor:default}.primary{background:#171717;color:#fff}.secondary{background:#f3f4f6;color:#171717}.login{background:#fff;color:#344054;border:1px solid #d0d5dd}
.error{min-height:18px;margin-top:10px;color:#b42318;font-size:12px;text-align:center}.warning{margin:0 0 14px;padding:11px 12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:12px;line-height:1.45}
.divider{display:flex;align-items:center;gap:10px;margin:17px 0 2px;color:#98a2b3;font-size:11px}.divider:before,.divider:after{content:"";height:1px;background:#eaecf0;flex:1}
.login-panel{margin-top:12px;padding-top:4px}.login-panel input+input{margin-top:10px}.hidden{display:none!important}
.back{height:auto;margin-top:10px;background:transparent;color:#667085;font-weight:650}
@media(max-width:340px){.pin-grid{gap:6px}.pin-digit{height:48px;font-size:20px}}
</style>
</head>
<body>
<section class="card" aria-live="polite">
  <h1 id="title">TAPHOA</h1>
  <p id="description">Đang kiểm tra liên kết…</p>
  <div class="warning hidden" id="warning">Liên kết của bạn chưa được bảo vệ bằng PIN. Nên tạo PIN để người chỉ có link không thể xem thông tin.</div>

  <div id="pinPanel">
    <div class="pin-grid" id="pinGrid" data-invalid="false" data-complete="false" aria-label="Mã PIN 6 số">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Số PIN 1">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 2">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 3">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 4">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 5">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 6">
    </div>
    <button id="submit" class="primary" type="button" disabled>Tiếp tục</button>
    <button id="skip" class="secondary hidden" type="button">Bỏ qua</button>
  </div>

  <div class="divider"><span>hoặc</span></div>
  <button id="showLogin" class="login" type="button">Đăng nhập</button>

  <div id="loginPanel" class="login-panel hidden">
    <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Tài khoản">
    <input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu">
    <button id="loginButton" class="primary" type="button">Đăng nhập</button>
    <button id="backButton" class="back" type="button">Quay lại</button>
  </div>

  <div class="error" id="error"></div>
</section>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.112.3?standalone';

const SUPABASE='https://gcnoahqsrquxkwkjbuxy.supabase.co';
const KEY='sb_publishable_UY3gfQ9MsntDFCUJ_uV0UA__eTYXz_w';
const STORE='taphoa.public.link.v1';
const AUTH_STORE='taphoa.xyz.auth.v2';
const params=new URLSearchParams(location.search);
const kh=String(params.get('kh')||'').trim().toLowerCase();
const skipKey='taphoa.public.pin.skips.v1:'+kh;
const client=createClient(SUPABASE,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:localStorage,storageKey:AUTH_STORE}});

const title=document.getElementById('title');
const description=document.getElementById('description');
const warning=document.getElementById('warning');
const pinPanel=document.getElementById('pinPanel');
const pinGrid=document.getElementById('pinGrid');
const pinInputs=[...pinGrid.querySelectorAll('[data-pin-digit]')];
const submit=document.getElementById('submit');
const skip=document.getElementById('skip');
const showLogin=document.getElementById('showLogin');
const loginPanel=document.getElementById('loginPanel');
const username=document.getElementById('username');
const password=document.getElementById('password');
const loginButton=document.getElementById('loginButton');
const backButton=document.getElementById('backButton');
const error=document.getElementById('error');

let pinConfigured=false;
let pinBusy=false;

function rootUrl(){return '/?'+params.toString();}
function readSkipCount(){try{return Math.max(0,Number(localStorage.getItem(skipKey))||0)}catch{return 0}}
function writeSkipCount(value){try{localStorage.setItem(skipKey,String(Math.max(0,value||0)))}catch{}}
function clearSkipCount(){try{localStorage.removeItem(skipKey)}catch{}}
function saveAccess(pin,mode){sessionStorage.setItem(STORE,JSON.stringify({kh,pin:String(pin||''),mode:String(mode||'pin')}));}
function setError(message=''){error.textContent=message;}

function getPinValue(){return pinInputs.map(input=>String(input.value||'').replace(/\D/g,'').slice(-1)).join('');}
function updatePinState(){
  const value=getPinValue();
  pinGrid.dataset.complete=String(value.length===6);
  if(value.length)pinGrid.dataset.invalid='false';
  submit.disabled=pinBusy||value.length!==6;
}
function clearPin({invalid=false}={}){
  pinInputs.forEach(input=>{input.value='';});
  pinGrid.dataset.invalid=String(invalid);
  updatePinState();
}
function focusPin(index=0){setTimeout(()=>pinInputs[Math.max(0,Math.min(5,index))]?.focus(),0);}
function fillPinDigits(digits,startIndex=0){
  const values=String(digits||'').replace(/\D/g,'');
  if(!values)return;
  const start=values.length>=6?0:startIndex;
  for(let i=0;i<values.length&&start+i<pinInputs.length;i++)pinInputs[start+i].value=values[i];
  updatePinState();
  const nextIndex=Math.min(start+values.length,pinInputs.length-1);
  focusPin(nextIndex);
}
function wirePinInputs(){
  pinInputs.forEach((input,index)=>{
    input.addEventListener('input',()=>{
      const digits=String(input.value||'').replace(/\D/g,'');
      input.value=digits.slice(-1);
      pinGrid.dataset.invalid='false';
      setError('');
      updatePinState();
      if(input.value&&index<pinInputs.length-1)pinInputs[index+1].focus();
    });
    input.addEventListener('keydown',event=>{
      if(event.key==='Backspace'&&!input.value&&index>0){
        event.preventDefault();
        pinInputs[index-1].value='';
        pinInputs[index-1].focus();
        updatePinState();
      }else if(event.key==='ArrowLeft'&&index>0){
        event.preventDefault();pinInputs[index-1].focus();
      }else if(event.key==='ArrowRight'&&index<pinInputs.length-1){
        event.preventDefault();pinInputs[index+1].focus();
      }else if(event.key==='Enter'&&getPinValue().length===6){
        event.preventDefault();submit.click();
      }
    });
    input.addEventListener('paste',event=>{
      const digits=String(event.clipboardData?.getData('text')||'').replace(/\D/g,'');
      if(!digits)return;
      event.preventDefault();
      fillPinDigits(digits,index);
    });
  });
}
function setBusy(button,busy,label){
  if(!button)return;
  if(!button.dataset.idle)button.dataset.idle=button.textContent;
  if(button===submit)pinBusy=busy;
  button.textContent=busy?label:(button.dataset.idle||button.textContent);
  if(button===submit)updatePinState();
  else button.disabled=busy;
}
async function rpc(name,args={}){
  const {data,error:rpcError}=await client.rpc(name,args);
  if(rpcError)throw rpcError;
  return data||{};
}
function enter(){location.replace(rootUrl());}
function showLoginPanel(){
  setError('');
  pinPanel.classList.add('hidden');
  showLogin.classList.add('hidden');
  loginPanel.classList.remove('hidden');
  setTimeout(()=>username.focus(),0);
}
function hideLoginPanel(){
  setError('');
  loginPanel.classList.add('hidden');
  pinPanel.classList.remove('hidden');
  showLogin.classList.remove('hidden');
  focusPin();
}
function renderGate(state){
  pinConfigured=state?.pin_configured===true;
  if(pinConfigured){
    title.textContent='Nhập mã PIN';
    description.textContent='Liên kết này đã được bảo vệ. Nhập PIN để tiếp tục.';
    submit.textContent='Tiếp tục';
    submit.dataset.idle='Tiếp tục';
    skip.classList.add('hidden');
    warning.classList.add('hidden');
  }else{
    title.textContent='Bảo vệ liên kết';
    description.textContent='Tạo PIN 6 số để người chỉ có link không thể xem thông tin của bạn.';
    submit.textContent='Tạo PIN';
    submit.dataset.idle='Tạo PIN';
    skip.classList.remove('hidden');
    warning.classList.toggle('hidden',readSkipCount()<2);
  }
  clearPin();
  focusPin();
}
async function loadGate(){
  if(!kh){
    title.textContent='Liên kết không hợp lệ';
    description.textContent='Không tìm thấy thông tin khách hàng.';
    pinPanel.classList.add('hidden');
    showLogin.classList.add('hidden');
    return;
  }
  try{
    const state=await rpc('taphoa_public_gate_state',{p_public_slug:kh});
    if(state?.ok!==true)throw new Error('not_found');
    if(state?.authenticated_bypass===true){enter();return;}
    renderGate(state);
  }catch{
    title.textContent='Không mở được liên kết';
    description.textContent='Liên kết không hợp lệ hoặc đã hết hiệu lực.';
    pinPanel.classList.add('hidden');
    showLogin.classList.add('hidden');
  }
}

wirePinInputs();
submit.addEventListener('click',async()=>{
  const pin=getPinValue();
  if(!/^\d{6}$/.test(pin)){setError('PIN gồm 6 chữ số.');return;}
  setBusy(submit,true,pinConfigured?'Đang kiểm tra…':'Đang tạo…');
  setError('');
  try{
    if(pinConfigured){
      const data=await rpc('taphoa_public_pin_check',{p_public_slug:kh,p_pin:pin});
      if(data?.ok!==true){
        if(data?.error==='pin_locked')throw new Error('locked');
        throw new Error('invalid');
      }
    }else{
      const data=await rpc('taphoa_public_pin_create',{p_public_slug:kh,p_pin:pin});
      if(data?.ok!==true){
        if(data?.error==='pin_already_set'){await loadGate();return;}
        throw new Error(data?.error||'create_failed');
      }
      clearSkipCount();
    }
    saveAccess(pin,'pin');
    enter();
  }catch(err){
    const code=String(err?.message||'');
    setError(code.includes('locked')?'PIN đang tạm khóa. Thử lại sau.':pinConfigured?'PIN không đúng.':'Không tạo được PIN. Vui lòng thử lại.');
    clearPin({invalid:true});
    focusPin();
  }finally{
    setBusy(submit,false,'');
  }
});

skip.addEventListener('click',()=>{
  writeSkipCount(readSkipCount()+1);
  saveAccess('','skip');
  enter();
});

showLogin.addEventListener('click',showLoginPanel);
backButton.addEventListener('click',hideLoginPanel);
password.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();loginButton.click();}});
loginButton.addEventListener('click',async()=>{
  const user=String(username.value||'').trim().toLowerCase();
  const pass=String(password.value||'');
  if(!user||!pass){setError('Nhập tài khoản và mật khẩu.');return;}
  setBusy(loginButton,true,'Đang đăng nhập…');
  setError('');
  try{
    const {error:loginError}=await client.auth.signInWithPassword({email:user+'@taphoa.chat',password:pass});
    if(loginError)throw loginError;
    const state=await rpc('taphoa_public_gate_state',{p_public_slug:kh});
    if(state?.authenticated_bypass!==true){
      await client.auth.signOut({scope:'local'}).catch(()=>{});
      setError('Tài khoản này không thuộc liên kết.');
      return;
    }
    sessionStorage.removeItem(STORE);
    enter();
  }catch{
    setError('Sai tài khoản hoặc mật khẩu.');
  }finally{
    setBusy(loginButton,false,'');
  }
});

loadGate();
</script>
</body>
</html>
