<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="TAPHOA">
<meta property="og:type" content="website">
<title>TAPHOA</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#171717;background:#f6f7f8;font-size:16px}
*{box-sizing:border-box}html,body{height:100%;height:100dvh;overflow:hidden}body{margin:0;background:#d9dee5;color:#171717}
button,input{font:inherit}.app{width:min(428px,100%);height:100dvh;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:#fff;overflow:hidden}
.top{min-height:58px;padding:10px 14px;background:#1e293b;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 2px 0 rgba(15,23,42,.18)}.brand{font-size:11px;font-weight:700;letter-spacing:.08em;color:#94a3b8}.title{margin:0;font-size:16px;font-weight:700;line-height:1.2;color:#fff}.sub{display:none}.top-share{height:34px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.08);padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}.top-share svg{width:14px;height:14px;stroke:currentColor}.top-share .chev{width:11px;height:11px;color:#cbd5e1}.top-share:active{background:rgba(255,255,255,.14)}.top-share:disabled{opacity:.45}
.view{min-height:0;overflow:hidden;background:#f3f4f6}.panel{height:100%;min-height:0;overflow:hidden;padding:0}.tab-shell{height:100%;min-height:0;display:flex;flex-direction:column;background:#f3f4f6}.tab-tools{flex:0 0 auto;padding:12px 14px 10px;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 1px 2px rgba(15,23,42,.025)}.list-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 14px 18px;background:#f3f4f6}.state{padding:28px 14px;text-align:center;color:#6b7280}.error{margin:20px auto;max-width:520px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;text-align:center;color:#6b7280}.error strong{display:block;color:#111827;margin-bottom:7px}
.bottom{display:flex;gap:0;border-bottom:1px solid #d9dee5;background:#fff;box-shadow:0 1px 0 rgba(15,23,42,.02)}.nav{position:relative;flex:1;height:58px;border:0;background:#fff;color:#98a2b3;font-weight:600;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav svg{width:17px;height:17px;stroke:currentColor}.nav::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;background:transparent}.nav[data-active="true"]{color:#111827;background:#fff;font-weight:700}.nav[data-active="true"]::after{background:#111827}
.toolbar{background:#fff;padding:0}.search{width:100%;height:40px;border:1px solid #d5d9df;border-radius:11px;padding:0 12px;background:#fff;outline:none;font-size:15px;font-weight:400;color:#111827}.search::placeholder{color:#98a2b3}.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{height:32px;flex:0 0 auto;border:1px solid #d8dde4;border-radius:999px;padding:0 11px;background:#fff;color:#475467;font-weight:600;font-size:12px;white-space:nowrap}.chip[data-active="true"]{background:#171717;color:#fff;border-color:#171717;font-weight:700}
.product-list{display:grid;gap:8px}.product{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;row-gap:5px;align-items:center;padding:11px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.04)}.product-name{grid-column:1;grid-row:1;min-width:0;font-size:14px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product-price{grid-column:1;grid-row:2;text-align:left;font-size:13px;font-weight:700;color:#16a34a;white-space:nowrap}.product-meta{display:none}.product-stock{grid-column:2;grid-row:1 / span 2;display:flex;justify-content:flex-end;align-items:center}.tag{display:none}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:3px 2px 8px}.section-title{margin:0;font-size:12px;font-weight:600;color:#667085}.employee-share{display:none}.empty{padding:28px 12px;text-align:center;color:#6b7280}
.order-list,.timeline{display:grid;gap:8px}.card{width:100%;border:1px solid #e1e5ea;border-radius:13px;background:#fff;padding:10px 12px;text-align:left;color:inherit;box-shadow:0 1px 2px rgba(15,23,42,.035)}.card-top{display:flex;justify-content:space-between;gap:12px}.card-title{font-size:14px;font-weight:750}.card-money{font-size:14px;font-weight:800;white-space:nowrap}.card-meta{margin-top:4px;font-size:11px;color:#667085}.card-foot{margin-top:4px;padding:0;border:0;font-size:11px;color:#667085}
.balance{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px 13px}.balance-label{font-size:11px;color:#6b7280}.balance-value{margin-top:2px;font-size:25px;font-weight:800;letter-spacing:-.03em}.balance-value[data-state="debt"]{color:#b42318}.balance-value[data-state="credit"]{color:#087a55}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:11px;padding:9px 11px}.stat span{display:block;font-size:10px;color:#6b7280}.stat strong{display:block;margin-top:2px;font-size:14px}
.stock-qty{display:grid;grid-template-columns:30px 36px 30px;height:32px;border:1px solid #d1d5db;border-radius:999px;overflow:hidden;background:#fff}.stock-qty button{border:0;background:#fff;font-size:18px;color:#667085;padding:0}.stock-qty button:last-child{background:#16a34a;color:#fff;margin:3px;border-radius:999px;font-size:17px}.stock-qty input{width:36px;height:100%;border:0;text-align:center;font:800 13px inherit;outline:none;background:#fff;padding:0}.stock-qty input:focus{background:#f0fdf4}.stock-footer{flex:0 0 auto;z-index:6;margin:0;padding:8px 14px 9px;border-top:1px solid #e5e7eb;background:#fff;box-shadow:0 -3px 10px rgba(15,23,42,.03)}.stock-summary{display:flex;align-items:center;justify-content:space-between;gap:12px}.stock-summary-main{font-size:13px;font-weight:800}.stock-summary-sub{margin-top:1px;font-size:10px;color:#6b7280}.stock-summary-money{font-size:15px;font-weight:850;color:#15803d;white-space:nowrap}.stock-footer-actions{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:7px;margin-top:7px}.stock-reset,.stock-save{height:40px;border-radius:11px;font-weight:800;font-size:12px}.stock-reset{border:1px solid #d1d5db;background:#fff;color:#4b5563}.stock-save{border:0;background:#16a34a;color:#fff}.stock-reset:disabled,.stock-save:disabled{opacity:.45}
.status-foot{height:34px;flex:0 0 auto;background:#1e293b;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-size:10px;font-weight:600}.status-dot{width:8px;height:8px;border-radius:999px;background:#16a34a;box-shadow:0 0 0 2px rgba(22,163,74,.16)}
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;background:rgba(17,24,39,.46)}.sheet[data-open="true"]{display:flex}.sheet-card{width:100%;height:auto;max-height:min(72dvh,620px);background:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid #eef0f2}.sheet-title{font-size:16px;font-weight:800}.close{width:34px;height:34px;border:0;border-radius:999px;background:#f3f4f6;font-size:22px}.sheet-meta{padding:8px 14px;background:#f8fafc;font-size:11px;color:#6b7280}.order-table{flex:0 1 auto;min-height:0;max-height:48dvh;overflow-y:auto}.orow{display:grid;grid-template-columns:minmax(0,1fr) 6ch 4ch 7ch;gap:8px;padding:9px 14px;border-bottom:1px solid #f1f2f3;font-size:12px}.orow.head{position:sticky;top:0;background:#fff;color:#9ca3af;font-size:10px;font-weight:750}.orow .n{font-weight:700}.orow .r{text-align:right;white-space:nowrap}.sheet-summary{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid #edf0f2}.sheet-summary small{display:block;color:#9ca3af}.sheet-summary strong{display:block;margin-top:3px}.sheet-summary .sum{text-align:right}
[hidden]{display:none!important}
@media(min-width:760px){body{padding:14px}.app{height:calc(100dvh - 28px);border:1px solid #111827;border-radius:18px;box-shadow:0 14px 40px rgba(15,23,42,.12)}.sheet{align-items:center;justify-content:center}.sheet-card{width:min(428px,calc(100vw - 40px));border-radius:20px}}
</style>
</head>
<body>
<div class="app">
  <nav class="bottom" aria-label="Điều hướng">
    <button class="nav" data-tab="hang" aria-label="Hàng">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16l-1.2 11H5.2L4 7Z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>
      <span>Hàng</span>
    </button>
    <button class="nav" data-tab="don" aria-label="Đơn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
      <span>Đơn</span>
    </button>
    <button class="nav" data-tab="no" aria-label="Công nợ">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h4M16 10h1M7 14h6"/></svg>
      <span>Công nợ</span>
    </button>
  </nav>
  <header class="top">
    <div><h1 class="title" id="title">Hàng</h1><div class="sub" id="sub"></div></div>
    <button type="button" class="top-share" id="share-nv" hidden aria-label="Gửi kiểm hàng cho nhân viên">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
      <span>Gửi kiểm hàng</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
    </button>
  </header>
  <main class="view">
    <section class="panel" id="panel"><div class="state">Đang tải…</div></section>
  </main>
  <div class="status-foot"><span class="status-dot"></span><span>Sẵn sàng</span></div>
</div>
<section class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Chi tiết đơn">
    <div class="sheet-head"><div class="sheet-title" id="sheet-title">Chi tiết đơn</div><button class="close" id="sheet-close" type="button">×</button></div>
    <div class="sheet-meta" id="sheet-meta"></div>
    <div class="order-table" id="sheet-body"></div>
    <div class="sheet-summary"><div><small>Số lượng</small><strong id="sheet-qty">0</strong></div><div class="sum"><small>Tổng thanh toán</small><strong id="sheet-total">0</strong></div></div>
  </div>
</section>
<script>
(()=>{
'use strict';
const QUOTE='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/v21-quote';
const DEBT='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/taphoa-public-debt';
const STOCK='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/taphoa-stock-check';
const p=new URLSearchParams(location.search);
const kh=p.get('kh')||'';
const requestedTab=p.get('tab')||'hang';
let tab=['hang','don','no'].includes(requestedTab)?requestedTab:'hang';
const legacyStockTab=requestedTab==='kiemhang';
const legacyStockToken=p.has('t');
let source=p.get('nguon')||'all';
let segment=['tat-ca','da-mua','goi-y'].includes(p.get('muc'))?p.get('muc'):'tat-ca';
const directOrder=(p.get('don')||'').toUpperCase();
const panel=document.getElementById('panel'),title=document.getElementById('title'),sub=document.getElementById('sub'),shareTop=document.getElementById('share-nv');
const sheet=document.getElementById('sheet'),sheetTitle=document.getElementById('sheet-title'),sheetMeta=document.getElementById('sheet-meta'),sheetBody=document.getElementById('sheet-body'),sheetQty=document.getElementById('sheet-qty'),sheetTotal=document.getElementById('sheet-total');
let quoteData=null,debtData=null,query='',directOrderOpened=false;
let stockData=null,stockBusy=false;
const stockQty=new Map();
const sourceFallback={'hang-thuong':'Hàng thường','hang-u':'Hàng U','sua':'Sữa','thuoc-la':'Thuốc lá','masan':'Masan'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:3}).format(Math.abs(Number(v)||0));
const qty=v=>{const n=Number(v)||0;return Number.isInteger(n)?String(n):String(n).replace(/0+$/,'').replace(/\.$/,'');};
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase();
const when=v=>{if(!v)return'';try{return new Date(v).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});}catch{return'';}};
function updateUrl(){
  const x=new URLSearchParams();x.set('kh',kh);x.set('tab',tab);
  if(tab==='hang'){if(source!=='all')x.set('nguon',source);if(segment!=='tat-ca')x.set('muc',segment);}
  history.replaceState(null,'','?'+x.toString());
}
function nav(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.dataset.active=String(b.dataset.tab===tab));
  if(tab==='hang')title.textContent='Hàng';
  else if(tab==='don')title.textContent='Đơn';
  else title.textContent='Công nợ';
  sub.textContent='';
  shareTop.hidden=!(tab==='hang'&&stockData?.employee_url);
  shareTop.disabled=!stockData?.employee_url;
}
function fail(text='Không tải được dữ liệu'){panel.innerHTML='<div class="error"><strong>'+esc(text)+'</strong>Kiểm tra lại liên kết được gửi từ TAPHOA.</div>';}
function sourceRows(){
  const rows=Array.isArray(quoteData?.sources)?quoteData.sources:[];
  return rows.map(r=>[String(r.source_key||''),String(r.source_name||sourceFallback[r.source_key]||r.source_key||'')]).filter(x=>x[0]);
}
function sourceName(key){return sourceRows().find(x=>x[0]===key)?.[1]||sourceFallback[key]||key||'Khác';}
function pack(item){const a=[];if(item.primary_packaging)a.push(item.primary_packaging);if(Number(item.units_per_carton)>0&&item.retail_unit)a.push(Number(item.units_per_carton)+' '+item.retail_unit);return a.join(' · ');}
function productSegment(item){return Number(item.purchase_orders)>0?'da-mua':Number(item.market_customers)>0?'goi-y':'khac';}
function renderHang(){
  nav();
  if(!quoteData){panel.innerHTML='<div class="state">Đang tải hàng…</div>';loadQuote();return;}
  if(!stockData){panel.innerHTML='<div class="state">Đang tải hàng…</div>';loadStockForHang();return;}
  hydrateStockQty();

  const sources=[['all','Tất cả nguồn'],...sourceRows()];
  if(source!=='all'&&!sources.some(x=>x[0]===source))source='all';
  let items=Array.isArray(quoteData.items)?quoteData.items:[];
  if(source!=='all')items=items.filter(x=>x.source_key===source);
  if(segment==='da-mua')items=items.filter(x=>productSegment(x)==='da-mua');
  if(segment==='goi-y')items=items.filter(x=>productSegment(x)==='goi-y');
  const q=norm(query).trim();if(q)items=items.filter(x=>norm(x.product_name+' '+sourceName(x.source_key)).includes(q));
  items=[...items].sort((a,b)=>
    String(a.product_name||'').localeCompare(String(b.product_name||''),'vi',{sensitivity:'base',numeric:true})
  );

  panel.innerHTML=
    '<div class="tab-shell"><div class="tab-tools">'+
    '<div class="toolbar"><input class="search" id="search" type="search" placeholder="Tìm sản phẩm">'+
    '<div class="chips" id="segments">'+[['tat-ca','Tất cả'],['da-mua','Đã mua'],['goi-y','Gợi ý']].map(x=>'<button class="chip" data-segment="'+x[0]+'" data-active="'+String(segment===x[0])+'">'+x[1]+'</button>').join('')+'</div>'+
    '<div class="chips" id="sources">'+sources.map(x=>'<button class="chip" data-source="'+esc(x[0])+'" data-active="'+String(source===x[0])+'">'+esc(x[1])+'</button>').join('')+'</div></div>'+
    '<div class="section-head"><div class="section-title" data-product-count>'+esc(source==='all'?'Tất cả nguồn':sourceName(source))+' · '+items.length+' sản phẩm</div></div></div>'+
    '<div class="list-scroll"><div class="product-list">'+(items.map(item=>{
      const code=String(item.product_code||'');
      const n=stockQty.get(code)||0;
      const stockControl='<div class="product-stock" data-stock-code="'+esc(code)+'"><div class="stock-qty"><button type="button" data-stock-delta="-1">−</button><input inputmode="numeric" value="'+(n||'')+'" placeholder="0" aria-label="Số lượng"><button type="button" data-stock-delta="1">+</button></div></div>';
      return '<article class="product" data-search="'+esc(norm(item.product_name+' '+sourceName(item.source_key)))+'"><div class="product-name">'+esc(item.product_name)+'</div><div class="product-price">'+money(item.display_price_vnd)+'</div>'+stockControl+'</article>';
    }).join('')||'<div class="empty">Không có sản phẩm trong mục này.</div>')+'</div></div>'+
    '<div class="stock-footer" data-stock-footer hidden><div class="stock-summary"><div><div class="stock-summary-main" data-stock-summary-main></div><div class="stock-summary-sub" data-stock-summary-sub></div></div><div class="stock-summary-money" data-stock-summary-money></div></div><div class="stock-footer-actions"><button type="button" class="stock-reset" data-stock-reset>Xóa / nhập lại</button><button type="button" class="stock-save" data-stock-save>Cập nhật</button></div></div></div>';

  panel.querySelector('#search')?.addEventListener('input',e=>{
    query=e.target.value;
    const q=norm(query).trim();
    let visible=0;
    panel.querySelectorAll('.product[data-search]').forEach(row=>{
      const show=!q||String(row.dataset.search||'').includes(q);
      row.hidden=!show;
      if(show)visible++;
    });
    const count=panel.querySelector('[data-product-count]');
    if(count)count.textContent=(source==='all'?'Tất cả nguồn':sourceName(source))+' · '+visible+' sản phẩm';
  });
  panel.querySelector('#segments')?.addEventListener('click',e=>{const b=e.target.closest('[data-segment]');if(!b)return;segment=b.dataset.segment;updateUrl();renderHang();});
  panel.querySelector('#sources')?.addEventListener('click',e=>{const b=e.target.closest('[data-source]');if(!b)return;source=b.dataset.source;updateUrl();renderHang();});

  renderStockSummary();
  shareTop.hidden=!stockData?.employee_url;
  panel.querySelector('.product-list')?.addEventListener('click',e=>{
    const b=e.target.closest('[data-stock-delta]');if(!b)return;
    const row=b.closest('[data-stock-code]');if(!row)return;
    const code=String(row.dataset.stockCode||'');
    setStockQty(code,(stockQty.get(code)||0)+Number(b.dataset.stockDelta||0));
    const input=row.querySelector('input');if(input)input.value=stockQty.get(code)||'';
  });
  panel.querySelector('.product-list')?.addEventListener('input',e=>{
    if(e.target.tagName!=='INPUT')return;
    const row=e.target.closest('[data-stock-code]');if(!row)return;
    const raw=String(e.target.value||'').replace(/\D/g,'');
    if(e.target.value!==raw)e.target.value=raw;
    setStockQty(String(row.dataset.stockCode||''),raw);
  });
  panel.querySelector('[data-stock-reset]')?.addEventListener('click',resetStockQty);
  panel.querySelector('[data-stock-save]')?.addEventListener('click',submitStock);
}
async function loadQuote(){
  try{const r=await fetch(QUOTE+'?kh='+encodeURIComponent(kh)+'&mini=1',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();if(!d?.ok||!Array.isArray(d.items))throw 0;quoteData=d;renderHang();}catch{fail('Không mở được hàng');}
}

function hydrateStockQty(){
  if(stockData?._qtyHydrated)return;
  for(const row of stockData?.items||[]){
    const value=row.owner_qty!==null&&row.owner_qty!==undefined?row.owner_qty:row.employee_qty;
    const n=Math.max(0,Math.trunc(Number(value)||0));
    if(n>0)stockQty.set(String(row.product_code),n);
  }
  stockData._qtyHydrated=true;
}
function stockTotals(){
  const products=new Map((stockData?.products||[]).map(x=>[String(x.product_code),x]));
  let codes=0,total=0,totalMoney=0;const bySource=new Map();
  for(const [code,value] of stockQty){
    const n=Math.max(0,Math.trunc(Number(value)||0));if(!n)continue;
    const item=products.get(code);if(!item)continue;
    codes++;total+=n;totalMoney+=n*(Number(item.sale_price_vnd)||0);
    const key=String(item.source_key||'');bySource.set(key,(bySource.get(key)||0)+n);
  }
  return {codes,total,totalMoney,parts:[...bySource].map(([k,n])=>(sourceFallback[k]||k||'Khác')+': '+n)};
}
function setStockQty(code,value){
  const n=Math.max(0,Math.trunc(Number(value)||0));
  if(n>0)stockQty.set(code,n);else stockQty.delete(code);
  renderStockSummary();
}
function renderStockSummary(){
  const t=stockTotals();
  const main=panel.querySelector('[data-stock-summary-main]');
  const subEl=panel.querySelector('[data-stock-summary-sub]');
  const moneyEl=panel.querySelector('[data-stock-summary-money]');
  if(main)main.textContent=t.codes+' mã · '+t.total+' sản phẩm';
  if(subEl)subEl.textContent=t.parts.length?t.parts.join(' · '):'Chưa chọn hàng';
  if(moneyEl)moneyEl.textContent=money(t.totalMoney);
  const reset=panel.querySelector('[data-stock-reset]');
  if(reset)reset.disabled=t.total<=0;
  const footer=panel.querySelector('[data-stock-footer]');
  if(footer)footer.hidden=t.total<=0;
}
function resetStockQty(){
  if(!stockQty.size)return;
  if(!window.confirm('Xóa toàn bộ số lượng đã nhập để nhập lại?'))return;
  stockQty.clear();
  renderHang();
}
async function shareEmployeeLink(){
  const url=String(stockData?.employee_url||'');
  if(!url)return;
  if(navigator.share){
    try{
      await navigator.share({title:'Kiểm hàng',text:'Nhập số lượng hàng cần kiểm:',url});
      return;
    }catch(error){
      if(error?.name==='AbortError')return;
    }
  }
  try{
    await navigator.clipboard.writeText(url);
    alert('Đã sao chép link nhân viên');
  }catch{
    window.prompt('Sao chép link nhân viên',url);
  }
}
async function loadStockForHang(){
  try{
    const r=await fetch(STOCK+'?kh='+encodeURIComponent(kh),{cache:'no-store'});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d?.ok||d.role!=='owner')throw 0;
    stockData=d;renderHang();
  }catch{fail('Không mở được hàng');}
}
async function submitStock(){
  if(stockBusy)return;
  const button=panel.querySelector('[data-stock-save]');
  const items=[...stockQty].filter(([,n])=>Number(n)>0).map(([product_code,n])=>({product_code,qty:Math.max(0,Math.trunc(Number(n)||0))}));
  stockBusy=true;if(button){button.disabled=true;button.textContent='Đang cập nhật…';}
  try{
    const r=await fetch(STOCK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({kh,action:'update',items})});
    const d=await r.json().catch(()=>({}));if(!r.ok||!d?.ok)throw 0;
    if(button)button.textContent='Đã cập nhật';
    setTimeout(()=>{if(button?.isConnected){button.disabled=false;button.textContent='Cập nhật';}},1400);
  }catch{
    if(button){button.disabled=false;button.textContent='Thử cập nhật lại';}
  }finally{stockBusy=false;}
}

function balanceInfo(v){const n=Math.round(Number(v)||0);if(n>0)return['Còn nợ',money(n),'debt'];if(n<0)return['Còn dư',money(n),'credit'];return['Đã hết nợ','0','zero'];}
function saleEntries(){return (debtData?.entries||[]).filter(x=>x.entry_type==='sale'&&x.order);}
function renderDon(){
  nav();
  if(!debtData){panel.innerHTML='<div class="state">Đang tải đơn…</div>';loadDebt();return;}
  const rows=saleEntries();
  panel.innerHTML='<div class="tab-shell"><div class="tab-tools"><div class="section-title">Đơn đã giao · '+rows.length+'</div></div><div class="list-scroll"><div class="order-list">'+(rows.map(row=>'<button class="card" type="button" data-order="'+esc(row.order.id)+'"><div class="card-top"><div class="card-title">'+esc(row.order.display_code||'Đơn hàng')+'</div><div class="card-money">'+money(row.amount_vnd)+'</div></div><div class="card-meta">'+esc(when(row.created_at))+'</div></button>').join('')||'<div class="empty">Chưa có đơn đã giao.</div>')+'</div></div></div>';
  panel.addEventListener('click',e=>{const b=e.target.closest('[data-order]');if(b)openOrder({id:b.dataset.order,code:''});},{once:false});
  if(directOrder&&!directOrderOpened){directOrderOpened=true;openOrder({id:'',code:directOrder});}
}
function typeLabel(row){if(row.entry_type==='sale')return row.order?.display_code?'Đơn '+row.order.display_code+' đã giao':'Đơn đã giao';if(row.entry_type==='collection')return'Đã thu tiền';if(row.entry_type==='payment')return'Thanh toán';return'Điều chỉnh';}
function renderNo(){
  nav();
  if(!debtData){panel.innerHTML='<div class="state">Đang tải công nợ…</div>';loadDebt();return;}
  const b=balanceInfo(debtData.balance_vnd);
  panel.innerHTML='<div class="tab-shell"><div class="tab-tools"><section class="balance"><div class="balance-label">'+b[0]+'</div><div class="balance-value" data-state="'+b[2]+'">'+b[1]+'</div></section>'+
    '<section class="stats"><div class="stat"><span>Đã giao</span><strong>'+money(debtData.total_delivered_vnd)+'</strong></div><div class="stat"><span>Đã thu</span><strong>'+money(debtData.total_collected_vnd)+'</strong></div></section>'+
    '<div class="section-title" style="margin-top:10px">Lịch sử giao dịch</div></div><div class="list-scroll"><div class="timeline">'+((debtData.entries||[]).map(row=>{const b2=balanceInfo(row.balance_after_vnd);return '<button class="card" type="button" '+(row.entry_type==='sale'&&row.order?'data-order="'+esc(row.order.id)+'"':'disabled')+'><div class="card-top"><div class="card-title">'+esc(typeLabel(row))+'</div><div class="card-money">'+(row.entry_type==='collection'?'-':'+')+money(row.amount_vnd)+'</div></div><div class="card-meta">'+esc(when(row.created_at))+(row.note?' · '+esc(row.note):'')+' · '+esc(b2[0])+': '+esc(b2[1])+'</div></button>';}).join('')||'<div class="empty">Chưa có giao dịch.</div>')+'</div></div></div>';
  panel.addEventListener('click',e=>{const b=e.target.closest('[data-order]');if(b)openOrder({id:b.dataset.order,code:''});},{once:false});
}
async function loadDebt(){
  try{const r=await fetch(DEBT+'?kh='+encodeURIComponent(kh),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();if(!d?.ok||!d.customer)throw 0;debtData=d;render();}catch{fail(tab==='don'?'Không mở được đơn':'Không mở được công nợ');}
}
async function openOrder({id='',code=''}) {
  sheet.dataset.open='true';sheet.setAttribute('aria-hidden','false');sheetTitle.textContent=code||'Chi tiết đơn';sheetMeta.textContent='Đang tải…';sheetBody.innerHTML='<div class="state">Đang tải chi tiết đơn…</div>';sheetQty.textContent='0';sheetTotal.textContent='0';
  try{const suffix=id?'&order='+encodeURIComponent(id):'&don='+encodeURIComponent(code);const r=await fetch(DEBT+'?kh='+encodeURIComponent(kh)+suffix,{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json(),o=d.order||{},rows=Array.isArray(o.items)?o.items:[];let tq=0;sheetTitle.textContent=o.display_code||code||'Chi tiết đơn';sheetMeta.textContent=((d.customer?.display_name)||'Khách hàng')+' · '+when(o.delivered_at||o.created_at);sheetBody.innerHTML='<div class="orow head"><div>Tên SP</div><div class="r">Đ.Giá</div><div class="r">SL</div><div class="r">T.Tiền</div></div>'+rows.map(x=>{tq+=Number(x.qty)||0;return '<div class="orow"><div class="n">'+esc(x.product_name||x.product_code||'Sản phẩm')+'</div><div class="r">'+money(x.unit_price_vnd)+'</div><div class="r">'+qty(x.qty)+'</div><div class="r">'+money(x.line_total_vnd)+'</div></div>';}).join('');sheetQty.textContent=rows.length+' mã · '+qty(tq)+' SP';sheetTotal.textContent=money(o.total_vnd);}catch{sheetBody.innerHTML='<div class="error"><strong>Không tải được chi tiết đơn</strong></div>';}
}
function closeSheet(){sheet.dataset.open='false';sheet.setAttribute('aria-hidden','true');}
function render(){if(tab==='hang')renderHang();else if(tab==='don')renderDon();else renderNo();}
document.querySelector('.bottom').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;updateUrl();render();});
shareTop.addEventListener('click',shareEmployeeLink);
document.getElementById('sheet-close').addEventListener('click',closeSheet);sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet();});
if(!kh){fail('Liên kết không hợp lệ');return;}
if(legacyStockTab||legacyStockToken)updateUrl();
nav();render();
})();
</script>
</body>
</html>
