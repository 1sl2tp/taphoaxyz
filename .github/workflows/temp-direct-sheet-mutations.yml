name: TEMP direct sheet mutations

on:
  push:
    branches: [fix/direct-sheet-mutations]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI contract follow-ups
        run: python tools/apply_ui_contract_followups.py
      - name: Commit follow-up implementation when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No follow-up changes to commit"
          else
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/fixed-ui-runtime-2.js src/fixed-ui-behavior.js tests/taphoa-source-create-contract.test.js
            git commit -m "fix: honor product save and debt stack contracts"
            git push origin HEAD:fix/direct-sheet-mutations
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/taphoa-migration-contract.test.js
      - run: node --test tests/taphoa-product-realtime-sync-contract.test.js
      - run: node --test tests/taphoa-direct-sheet-mutations.test.js
      - run: npm run build:production
      - run: node --test tests/*.test.js
