name: TAPHOA independent core TDD

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - fix/fixed-ui-behavior-audit
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/taphoa-migration-contract.test.js
      - run: node --test tests/*.test.js
      - run: npm run build:production
