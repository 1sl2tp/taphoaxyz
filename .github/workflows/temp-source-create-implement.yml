name: Source create implementation

permissions:
  contents: write

on:
  push:
    branches:
      - fix/product-source-create
    paths:
      - .github/workflows/temp-source-create-implement.yml

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-source-create
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire source creation into production bridge and editor
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge=Path('src/fixed-production-bridge.js')
          text=bridge.read_text(encoding='utf-8')
          anchor="""async function updateProduct(payload={}){\n"""
          insert="""async function createSource(name){\n  const result=await business.createSource(String(name||'').trim());\n  await refresh(['products']);\n  window.dispatchEvent(new CustomEvent('taphoa-production-sync',{detail:{changed:['products']}}));\n  return result;\n}\n\nasync function updateProduct(payload={}){\n"""
          if anchor not in text:
              raise SystemExit('bridge updateProduct anchor missing')
          text=text.replace(anchor,insert,1)
          old="""login,restore,logout,bootstrap,refresh,syncOnce,readSheet,debtLedger,ledgerToRows,updateProduct,"""
          new="""login,restore,logout,bootstrap,refresh,syncOnce,readSheet,debtLedger,ledgerToRows,createSource,updateProduct,"""
          if old not in text:
              raise SystemExit('bridge export anchor missing')
          text=text.replace(old,new,1)
          bridge.write_text(text,encoding='utf-8')

          runtime=Path('src/fixed-ui-runtime-2.js')
          text=runtime.read_text(encoding='utf-8')
          old="""        function getProductEditorSources() {\n            const sources = [\n                ...productEditorRows.map(r => String(r[4] || '').trim()).filter(Boolean),\n                ...productEditorCustomSources.map(v => String(v || '').trim()).filter(Boolean),\n            ];\n            return Array.from(new Set(sources));\n        }\n"""
          new="""        function getProductEditorSources() {\n            const backendSources = (window.TAPHOA_PRODUCTION?.getState?.()?.sources || [])\n                .map(source => String(source?.name || source?.ten || source?.source_name || source?.source_key || '').trim())\n                .filter(Boolean);\n            const sources = [\n                ...backendSources,\n                ...productEditorRows.map(r => String(r[4] || '').trim()).filter(Boolean),\n                ...productEditorCustomSources.map(v => String(v || '').trim()).filter(Boolean),\n            ];\n            return Array.from(new Set(sources));\n        }\n"""
          if old not in text:
              raise SystemExit('getProductEditorSources block missing')
          text=text.replace(old,new,1)

          old="""        function saveNewProductEditorSource() {\n            const input = document.getElementById('productEditorNewSourceInput');\n            const value = String(input?.value || '').trim();\n            if (!value) {\n                showToast(\"Nhập tên nguồn trước.\", \"warning\");\n                return;\n            }\n            const exists = getProductEditorSources().some(v => v.toLowerCase() === value.toLowerCase());\n            if (!exists) productEditorCustomSources.push(value);\n            renderProductEditorSources();\n            renderProductEditorSourcePicker();\n            closeAddSourceModal();\n            showToast(\"Đã thêm nguồn mới.\", \"success\");\n        }\n"""
          new="""        async function saveNewProductEditorSource() {\n            const input = document.getElementById('productEditorNewSourceInput');\n            const value = String(input?.value || '').trim();\n            if (!value) {\n                showToast(\"Nhập tên nguồn trước.\", \"warning\");\n                return;\n            }\n            try {\n                const result = await window.TAPHOA_PRODUCTION.createSource(value);\n                const savedName = String(result?.name || value).trim();\n                const exists = getProductEditorSources().some(v => v.toLowerCase() === savedName.toLowerCase());\n                if (!exists) productEditorCustomSources.push(savedName);\n                renderProductEditorSources();\n                renderProductEditorSourcePicker();\n                closeAddSourceModal();\n                showToast(\"Đã thêm nguồn mới.\", \"success\");\n            } catch (error) {\n                console.error('create product source', error);\n                showToast(\"Không thêm được nguồn.\", \"warning\");\n            }\n        }\n"""
          if old not in text:
              raise SystemExit('saveNewProductEditorSource block missing')
          text=text.replace(old,new,1)
          runtime.write_text(text,encoding='utf-8')
          PY
      - run: node --test tests/taphoa-source-create-contract.test.js
      - run: npm install --no-audit --no-fund
      - run: npm run build:production
      - run: node --test tests/*.test.js
      - name: Commit implementation
        run: |
          git config user.name "1sl2tp"
          git config user.email "1sl2tp@gmail.com"
          git add src/fixed-production-bridge.js src/fixed-ui-runtime-2.js
          git commit -m "feat: persist product sources to Supabase"
          git push origin HEAD:fix/product-source-create
