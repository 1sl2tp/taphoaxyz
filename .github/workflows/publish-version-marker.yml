name: TAPHOA build identity audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployment identity contract
        run: node --test tests/deploy-quota-contract.test.js tests/auto-update-contract.test.js tests/production-build-contract.test.js
