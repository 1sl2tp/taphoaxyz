name: Source create contract

permissions:
  contents: read

on:
  push:
    branches:
      - fix/product-source-create

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/taphoa-source-create-contract.test.js
