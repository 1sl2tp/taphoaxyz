name: V1.29 security check
on:
  push:
    branches: [main, security/v1.29]
  pull_request:
jobs:
  build-security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build:production
      - run: node --test tests/shared-auth-contract.test.js tests/production-build-contract.test.js
      - name: Verify current modular runtime security contract
        run: |
          test -f dist/index.html
          test -f dist/src/core/config.js
          test -f dist/src/core/auth.js
          test -f dist/src/core/business.js
          grep -q 'src/app.js' dist/index.html
          grep -q 'gcnoahqsrquxkwkjbuxy.supabase.co' dist/src/core/config.js
          grep -q 'taphoa.xyz.auth.v2' dist/src/core/config.js
          grep -q 'signInWithPassword' dist/src/core/auth.js
          grep -q 'taphoa_access_context' dist/src/core/auth.js
          grep -q 'taphoa_app_bootstrap' dist/src/core/business.js
          grep -q 'taphoa_save_order' dist/src/core/business.js
          ! grep -R -q 'crdbhkdeqyehsbzgggbs' dist/index.html dist/src
          ! grep -R -E -q 'shop-auth|shop_identities' dist/index.html dist/src
          ! grep -R -q 'localStorage.getItem("taphoa_session")' dist/index.html dist/src
          ! grep -R -q 'localStorage.setItem("taphoa_session"' dist/index.html dist/src
