name: One-shot currency placeholder cleanup

permissions:
  contents: write

on:
  push:
    branches:
      - fix/product-realtime-sheet-sync
    paths:
      - .github/workflows/temp-fix-currency-placeholders.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-realtime-sheet-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove only the three stale currency placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('src/fixed-ui-markup-1.js'),
              Path('src/fixed-ui-markup-4.js'),
              Path('src/fixed-ui-markup-5.js'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count('0 đ')
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 "0 đ", found {count}')
              path.write_text(text.replace('0 đ', '0'), encoding='utf-8')
          PY
      - name: Verify currency suffix contract
        run: node --test tests/fixed-ui-no-currency-suffix.test.js
      - name: Commit generated markup cleanup
        run: |
          git config user.name "1sl2tp"
          git config user.email "1sl2tp@gmail.com"
          git add src/fixed-ui-markup-1.js src/fixed-ui-markup-4.js src/fixed-ui-markup-5.js
          git commit -m "fix: remove currency suffix placeholders"
          git push origin HEAD:fix/product-realtime-sheet-sync
