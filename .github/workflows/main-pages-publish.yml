name: TAPHOA main publish

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin-gia.html'
      - 'CNAME'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'src/**'
      - 'no/**'
      - 'd/**'
      - 'b/**'
      - 'kiemhang/**'
      - 'kh/**'
      - 'bao-gia-sua/**'
      - 'bao-gia/**'
      - 'scripts/**'
      - '.github/workflows/main-pages-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build exact main commit
        run: npm run build:production
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Bind Pages domain contract
        run: cp CNAME dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Pages custom domain
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          DOMAIN="$(tr -d '\r\n[:space:]' < CNAME)"
          test -n "$DOMAIN"
          echo "Expected domain: $DOMAIN"
          echo "GitHub Pages URL: $PAGE_URL"

          case "$PAGE_URL" in
            "https://$DOMAIN/"|"https://$DOMAIN") ;;
            *)
              echo "::error::GitHub Pages Custom domain is not bound to $DOMAIN. Open Settings → Pages → Custom domain and save $DOMAIN."
              exit 1
              ;;
          esac

          CNAME_TARGET="$(dig +short CNAME "$DOMAIN" | head -1 | tr -d '\r\n')"
          echo "DNS CNAME: $CNAME_TARGET"
          case "$CNAME_TARGET" in
            *.github.io.) ;;
            *)
              echo "::error::DNS for $DOMAIN must be a CNAME to a github.io host."
              exit 1
              ;;
          esac

          for attempt in 1 2 3 4 5 6; do
            CODE="$(curl -L -sS -o /tmp/pages-domain.html -w '%{http_code}' --max-time 20 "https://$DOMAIN/" || true)"
            if [ "$CODE" = "200" ]; then
              echo "HTTPS OK: https://$DOMAIN/"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $CODE; retrying..."
            sleep 10
          done

          echo "::error::https://$DOMAIN/ did not return HTTP 200 after deployment."
          exit 1
