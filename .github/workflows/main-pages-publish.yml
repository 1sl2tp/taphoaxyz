name: TAPHOA main publish

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin-gia.html'
      - 'CNAME'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'src/**'
      - 'no/**'
      - 'd/**'
      - 'b/**'
      - 'kiemhang/**'
      - 'kh/**'
      - 'bao-gia-sua/**'
      - 'bao-gia/**'
      - 'ncc/**'
      - 'ghi-chu/**'
      - 'scripts/**'
      - '.github/workflows/main-pages-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Require all contract tests to pass before publishing
        run: npm test

      - name: Build exact main commit
        run: npm run build:production
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Bind Pages domain contract
        run: cp CNAME dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Pages custom domain
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          DOMAIN="$(tr -d '\r\n[:space:]' < CNAME)"
          test -n "$DOMAIN"
          echo "Expected domain: $DOMAIN"
          echo "GitHub Pages URL: $PAGE_URL"

          case "$PAGE_URL" in
            "https://$DOMAIN/"|"https://$DOMAIN") ;;
            *)
              echo "::error::GitHub Pages Custom domain is not bound to $DOMAIN. Open Settings → Pages → Custom domain and save $DOMAIN."
              exit 1
              ;;
          esac

          CNAME_TARGET="$(dig +short CNAME "$DOMAIN" | head -1 | tr -d '\r\n')"
          echo "DNS CNAME: $CNAME_TARGET"
          case "$CNAME_TARGET" in
            *.github.io.) ;;
            *)
              echo "::error::DNS for $DOMAIN must be a CNAME to a github.io host."
              exit 1
              ;;
          esac

          # SPEC-TAPHOA-LIVE-BUILD-GATE-20261108
          # HTTP 200 can still be the previous app. Verify the exact immutable
          # build identity from the *deployed* root and uncached manifest.
          # The /kh/ PIN gate redirects to / with the original query intact.
          EXPECTED_BUILD="$(node -e 'process.stdout.write(require("./dist/version.json").build_id || "")')"
          test -n "$EXPECTED_BUILD"
          test "$EXPECTED_BUILD" != "source-main"
          echo "Expected deployed build: $EXPECTED_BUILD"

          for attempt in 1 2 3 4 5 6 7 8; do
            ROOT_CODE="$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/pages-domain.html -w '%{http_code}' --max-time 20 "https://$DOMAIN/?__taphoa_verify=$GITHUB_SHA" || true)"
            VERSION_CODE="$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/pages-version.json -w '%{http_code}' --max-time 20 "https://$DOMAIN/version.json?__taphoa_verify=$GITHUB_SHA" || true)"
            GATE_CODE="$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/pages-customer-gate.html -w '%{http_code}' --max-time 20 "https://$DOMAIN/kh/?__taphoa_verify=$GITHUB_SHA" || true)"

            LIVE_VERSION=""
            LIVE_META=""
            if [ "$VERSION_CODE" = "200" ]; then
              LIVE_VERSION="$(node -e 'try { process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/pages-version.json","utf8")).build_id || "") } catch (_) {}')"
            fi
            if [ "$ROOT_CODE" = "200" ]; then
              LIVE_META="$(node -e 'const html=require("fs").readFileSync("/tmp/pages-domain.html","utf8"); process.stdout.write(html.match(/<meta[^>]*name="app-build-id"[^>]*content="([^"]+)"/i)?.[1] || "")')"
            fi

            echo "Attempt $attempt: root=$ROOT_CODE meta=$LIVE_META manifest=$VERSION_CODE build=$LIVE_VERSION kh=$GATE_CODE"
            if [ "$ROOT_CODE" = "200" ] && [ "$VERSION_CODE" = "200" ] && [ "$GATE_CODE" = "200" ] \
              && [ "$LIVE_VERSION" = "$EXPECTED_BUILD" ] && [ "$LIVE_META" = "$EXPECTED_BUILD" ] \
              && grep -F -q 'function rootUrl(){return' /tmp/pages-customer-gate.html; then
              echo "LIVE VERIFIED: https://$DOMAIN/ + /kh/ use build $EXPECTED_BUILD"
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then sleep 10; fi
          done

          echo "::error::Live Pages does not serve expected build $EXPECTED_BUILD on app root and /kh/."
          exit 1
