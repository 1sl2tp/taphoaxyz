name: One-shot TAPHOA bag icon v5
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build crisp bag icons
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json

          ROOT=Path('.')
          ASSETS=ROOT/'src'/'assets'
          GREEN=(22,163,74)
          WHITE=(255,255,255,255)

          def bag_icon(size, maskable=False):
              scale=4
              S=size*scale
              im=Image.new('RGBA',(S,S),GREEN+(255,))
              d=ImageDraw.Draw(im)
              k=S/512.0
              if maskable:
                  body=(154,198,358,384)
                  radius=30
                  handle=(194,120,318,252)
                  handle_w=28
              else:
                  body=(126,176,386,416)
                  radius=34
                  handle=(176,78,336,252)
                  handle_w=32

              b=tuple(int(v*k) for v in body)
              d.rounded_rectangle(b,radius=int(radius*k),fill=WHITE)

              h=tuple(int(v*k) for v in handle)
              w=max(1,int(handle_w*k))
              d.arc(h,start=180,end=360,fill=WHITE,width=w)
              left=int(handle[0]*k)
              right=int(handle[2]*k)
              base=int(body[1]*k)+int(8*k)
              mid=int(((handle[1]+handle[3])/2)*k)
              d.line((left,mid,left,base),fill=WHITE,width=w)
              d.line((right,mid,right,base),fill=WHITE,width=w)

              return im.resize((size,size),Image.Resampling.LANCZOS).convert('RGB')

          bag_icon(180).save(ASSETS/'app-icon-180-bag-v5.png',optimize=True)
          bag_icon(192).save(ASSETS/'app-icon-192-bag-v5.png',optimize=True)
          bag_icon(512).save(ASSETS/'app-icon-512-bag-v5.png',optimize=True)
          bag_icon(512,True).save(ASSETS/'app-icon-maskable-512-bag-v5.png',optimize=True)

          # Notification large icon: same language, slightly more breathing room.
          def notification_icon(size=192):
              im=Image.new('RGBA',(size,size),GREEN+(255,))
              d=ImageDraw.Draw(im)
              d.rounded_rectangle((47,66,145,154),radius=14,fill=WHITE)
              d.arc((66,30,126,102),start=180,end=360,fill=WHITE,width=12)
              d.line((66,66,66,74),fill=WHITE,width=12)
              d.line((126,66,126,74),fill=WHITE,width=12)
              return im
          notification_icon().save(ASSETS/'notification-icon-192-v5.png',optimize=True)

          # Android/Web Push badge: transparent monochrome alpha mask.
          badge=Image.new('RGBA',(96,96),(0,0,0,0))
          bd=ImageDraw.Draw(badge)
          bd.rounded_rectangle((24,34,72,76),radius=8,fill=(255,255,255,255))
          bd.arc((34,14,62,49),start=180,end=360,fill=(255,255,255,255),width=6)
          bd.line((34,34,34,38),fill=(255,255,255,255),width=6)
          bd.line((62,34,62,38),fill=(255,255,255,255),width=6)
          badge.save(ASSETS/'notification-badge-96-v5.png',optimize=True)

          (ASSETS/'app-icon.svg').write_text(
          '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bán Hàng">
            <rect width="512" height="512" fill="#16a34a"/>
            <rect x="126" y="176" width="260" height="240" rx="34" fill="#fff"/>
            <path d="M176 184v-24c0-51 35-82 80-82s80 31 80 82v24" fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round"/>
          </svg>
          ''',encoding='utf-8')

          (ASSETS/'favicon.svg').write_text(
          '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bán Hàng">
            <rect width="64" height="64" rx="14" fill="#16a34a"/>
            <rect x="17" y="25" width="30" height="28" rx="5" fill="#fff"/>
            <path d="M22 27v-4c0-7 4-12 10-12s10 5 10 12v4" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
          </svg>
          ''',encoding='utf-8')

          index_path=ROOT/'index.html'
          index=index_path.read_text('utf-8')
          index=index.replace('app-icon-180-bag-v4.png','app-icon-180-bag-v5.png')
          index_path.write_text(index,'utf-8')

          manifest_path=ROOT/'manifest.webmanifest'
          manifest=json.loads(manifest_path.read_text('utf-8'))
          manifest['icons']=[
              {'src':'./src/assets/app-icon-192-bag-v5.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./src/assets/app-icon-512-bag-v5.png','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'./src/assets/app-icon-maskable-512-bag-v5.png','sizes':'512x512','type':'image/png','purpose':'maskable'},
          ]
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n','utf-8')

          test_path=ROOT/'tests'/'pwa-install-contract.test.js'
          test=test_path.read_text('utf-8')
          test=test.replace('app-icon-192-bag-v4.png','app-icon-192-bag-v5.png')
          test=test.replace('app-icon-512-bag-v4.png','app-icon-512-bag-v5.png')
          test=test.replace('app-icon-maskable-512-bag-v4.png','app-icon-maskable-512-bag-v5.png')
          test=test.replace('app-icon-180-bag-v4.png','app-icon-180-bag-v5.png')
          test_path.write_text(test,'utf-8')

          version_path=ROOT/'version.json'
          version=json.loads(version_path.read_text('utf-8'))
          version['ui_fix']='crisp-bag-icons-v5'
          version_path.write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n','utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/app-icon.svg src/assets/favicon.svg src/assets/app-icon-180-bag-v5.png src/assets/app-icon-192-bag-v5.png src/assets/app-icon-512-bag-v5.png src/assets/app-icon-maskable-512-bag-v5.png src/assets/notification-icon-192-v5.png src/assets/notification-badge-96-v5.png index.html manifest.webmanifest tests/pwa-install-contract.test.js version.json
          git commit -m "Refine TAPHOA bag icon geometry"
          git push
