name: TEMP move sync metadata
# retry after ledger contract fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-move-sync-metadata.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move tracking to AY AZ
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/taphoa-sheet-sync/index.ts')
          s=p.read_text()

          s=s.replace('const TRACKING_HASH_HEADER="__SYNC_HASH";','const TRACKING_HASH_HEADER="__SYNC_HASH";\nconst TRACKING_ID_COL="AY";\nconst TRACKING_HASH_COL="AZ";\nconst TRACKING_ID_INDEX=50;\nconst TRACKING_HASH_INDEX=51;\nconst TRACKING_COLUMN_COUNT=52;')
          s=s.replace('function sheetUnit(v:number|null){return v===null?"":v/1000;}','function sheetUnit(v:number|null){return v===null?"":v/1000;}\nfunction rowWithTracking(values:unknown[],marker:string,hash:string){\n  const row=Array(TRACKING_COLUMN_COUNT).fill("");\n  for(let i=0;i<Math.min(4,values.length);i++)row[i]=values[i];\n  row[TRACKING_ID_INDEX]=marker;row[TRACKING_HASH_INDEX]=hash;return row;\n}')
          s=s.replace('const range=`${quotedSheet(tab)}!A:P`;','const range=`${quotedSheet(tab)}!A:AZ`;')

          old='''async function ensureSourceLayout(meta:SheetMeta){\n  const rows=await readManagerTab(meta.title);\n  const header=rows[0]||[];\n  const writes: Array<{range:string;values:unknown[][]}>=[];\n  if(clean(header[0])!=="Mã SP"||clean(header[1])!=="Tên sản phẩm"){\n    writes.push({range:`${quotedSheet(meta.title)}!A1:D1`,values:[["Mã SP","Tên sản phẩm","Giá vốn","Giá bán của mình"]]});\n  }\n  if(clean(header[14])!==TRACKING_ID_HEADER||clean(header[15])!==TRACKING_HASH_HEADER){\n    writes.push({range:`${quotedSheet(meta.title)}!O1:P1`,values:[[TRACKING_ID_HEADER,TRACKING_HASH_HEADER]]});\n  }\n  await writeRanges(writes);\n  await batchUpdate([{updateDimensionProperties:{range:{sheetId:meta.sheetId,dimension:"COLUMNS",startIndex:14,endIndex:16},properties:{hiddenByUser:true},fields:"hiddenByUser"}}]);\n}'''
          new='''async function ensureSourceLayout(meta:SheetMeta){\n  if(meta.columnCount<TRACKING_COLUMN_COUNT){\n    await batchUpdate([{appendDimension:{sheetId:meta.sheetId,dimension:"COLUMNS",length:TRACKING_COLUMN_COUNT-meta.columnCount}}]);\n    meta.columnCount=TRACKING_COLUMN_COUNT;\n  }\n  const rows=await readManagerTab(meta.title);\n  const header=rows[0]||[];\n  const writes: Array<{range:string;values:unknown[][]}>=[];\n  if(clean(header[0])!=="Mã SP"||clean(header[1])!=="Tên sản phẩm"){\n    writes.push({range:`${quotedSheet(meta.title)}!A1:D1`,values:[["Mã SP","Tên sản phẩm","Giá vốn","Giá bán của mình"]]});\n  }\n  if(clean(header[TRACKING_ID_INDEX])!==TRACKING_ID_HEADER||clean(header[TRACKING_HASH_INDEX])!==TRACKING_HASH_HEADER){\n    writes.push({range:`${quotedSheet(meta.title)}!${TRACKING_ID_COL}1:${TRACKING_HASH_COL}1`,values:[[TRACKING_ID_HEADER,TRACKING_HASH_HEADER]]});\n  }\n  await writeRanges(writes);\n  await batchUpdate([{updateDimensionProperties:{range:{sheetId:meta.sheetId,dimension:"COLUMNS",startIndex:50,endIndex:52},properties:{hiddenByUser:true},fields:"hiddenByUser"}}]);\n}'''
          if old not in s: raise SystemExit('ensureSourceLayout pattern missing')
          s=s.replace(old,new)
          s=s.replace('columnCount:16,frozenRowCount:1,frozenColumnCount:3','columnCount:52,frozenRowCount:1,frozenColumnCount:3')
          s=s.replace('rowCount:1000,columnCount:16};','rowCount:1000,columnCount:52};')

          s=s.replace('clean(cache.rows[i]?.[14])===marker','clean(cache.rows[i]?.[TRACKING_ID_INDEX])===marker')
          s=s.replace('clean(r?.[14])===marker','clean(r?.[TRACKING_ID_INDEX])===marker')
          s=s.replace('const values=["",req.product_name,sheetUnit(num(req.input_price_vnd)),sheetUnit(num(req.sale_price_vnd)),"","","","","","","","","","",marker,pHash];','const values=rowWithTracking(["",req.product_name,sheetUnit(num(req.input_price_vnd)),sheetUnit(num(req.sale_price_vnd))],marker,pHash);')

          s=s.replace('{range:`${quotedSheet(cache.meta.title)}!O${rowIndex+1}:P${rowIndex+1}`,values:[[marker,hash]]}','{range:`${quotedSheet(cache.meta.title)}!${TRACKING_ID_COL}${rowIndex+1}:${TRACKING_HASH_COL}${rowIndex+1}`,values:[[marker,hash]]}')
          s=s.replace('await writeRanges([{range:`${quotedSheet(cache.meta.title)}!O${rowIndex+1}:P${rowIndex+1}`,values:[[productMarker(code),hash]]}]);','await writeRanges([{range:`${quotedSheet(cache.meta.title)}!${TRACKING_ID_COL}${rowIndex+1}:${TRACKING_HASH_COL}${rowIndex+1}`,values:[[productMarker(code),hash]]}]);')
          s=s.replace('{range:`${quotedSheet(target.meta.title)}!O${rowNo}:P${rowNo}`,values:[[productMarker(item.product_code),item.row_hash]]}','{range:`${quotedSheet(target.meta.title)}!${TRACKING_ID_COL}${rowNo}:${TRACKING_HASH_COL}${rowNo}`,values:[[productMarker(item.product_code),item.row_hash]]}')
          s=s.replace('rowNo=await appendManagerRow(target.meta.title,[...values,"","","","","","","","","","",productMarker(item.product_code),item.row_hash]);','rowNo=await appendManagerRow(target.meta.title,rowWithTracking(values,productMarker(item.product_code),item.row_hash));')
          s=s.replace('{range:`${quotedSheet(cache.meta.title)}!O${i+1}:P${i+1}`,values:[[productMarker(assigned),hash]]}','{range:`${quotedSheet(cache.meta.title)}!${TRACKING_ID_COL}${i+1}:${TRACKING_HASH_COL}${i+1}`,values:[[productMarker(assigned),hash]]}')
          s=s.replace('cache.rows[i][14]=productMarker(assigned);cache.rows[i][15]=hash;','cache.rows[i][TRACKING_ID_INDEX]=productMarker(assigned);cache.rows[i][TRACKING_HASH_INDEX]=hash;')
          s=s.replace('clean(cache.rows[i]?.[14])!==marker||clean(cache.rows[i]?.[15])!==hash','clean(cache.rows[i]?.[TRACKING_ID_INDEX])!==marker||clean(cache.rows[i]?.[TRACKING_HASH_INDEX])!==hash')
          s=s.replace('{range:`${quotedSheet(cache.meta.title)}!O${i+1}:P${i+1}`,values:[[marker,hash]]}','{range:`${quotedSheet(cache.meta.title)}!${TRACKING_ID_COL}${i+1}:${TRACKING_HASH_COL}${i+1}`,values:[[marker,hash]]}')

          p.write_text(s)
          PY
      - name: Contract checks
        run: |
          npm install --no-audit --no-fund
          node --test tests/taphoa-product-realtime-sync-contract.test.js tests/taphoa-sheet-sync-contract.test.js
          npm run build:production
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "1sl2tp"
          git config user.email "1sl2tp@gmail.com"
          git add supabase/functions/taphoa-sheet-sync/index.ts
          git diff --cached --check
          git commit -m "fix: isolate sheet sync metadata in AY AZ"
          git push origin HEAD:main
