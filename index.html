<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="app-build-id" content="2d06397c9354fe96a7061cd75791fd9e21b049f6">
<title>taphoa.xyz</title>
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/shell.css">
<link rel="stylesheet" href="./src/styles/sales.css">
<link rel="stylesheet" href="./src/styles/delivered.css">
<link rel="stylesheet" href="./src/styles/pending.css">
<link rel="stylesheet" href="./src/styles/debt.css">
<link rel="stylesheet" href="./src/styles/ui-system.css">
<link rel="stylesheet" href="./src/styles/iphone-visual-cleanup.css">
<link rel="stylesheet" href="./src/styles/scroll-owner.css">
</head>
<body>
<div class="taphoa-viewport" id="taphoaViewport">
  <section class="login-screen" id="loginScreen">
    <div class="login-wrap">
      <div class="login-brand">
        <img class="login-logo" src="./src/assets/logo.jpg" alt="logo">
        <div class="login-brand-name" data-ui-type="shell-title">taphoa.xyz</div>
        <div class="login-brand-sub" data-ui-type="meta">Quản lý đơn hàng thông minh</div>
      </div>
      <form class="login-card" id="loginForm">
        <h1 data-ui-type="panel-title">Đăng nhập</h1>
        <div class="login-field"><input id="loginUsername" autocomplete="username" placeholder="Tên đăng nhập"></div>
        <div class="login-field"><input class="login-password" id="loginPassword" type="password" autocomplete="current-password" placeholder="Mật khẩu"><button class="login-eye" type="button" id="loginEye" aria-label="Hiện mật khẩu">◉</button></div>
        <label class="login-remember" data-ui-type="body"><input id="loginRemember" type="checkbox">Lưu mật khẩu</label>
        <div class="login-error" id="loginError" data-ui-type="meta" hidden></div>
        <button class="login-submit" id="loginSubmit" type="submit" data-ui-type="action">Đăng nhập →</button>
      </form>
    </div>
  </section>
  <section class="app-shell" id="appShell" hidden>
    <header class="app-topbar" id="appTopbar">
      <nav class="app-nav" id="appNav" aria-label="Điều hướng"></nav>
      <button class="account-button" id="accountButton" type="button" aria-label="Tài khoản" aria-haspopup="dialog" aria-controls="accountSheet"><span id="accountButtonInitials" aria-hidden="true">TK</span></button>
    </header>
    <main class="screen-host" id="screenHost"></main>
    <div id="accountSheet" class="account-sheet" hidden>
      <button class="account-sheet-backdrop" id="accountSheetBackdrop" type="button" aria-label="Đóng"></button>
      <section class="account-sheet-card" role="dialog" aria-modal="true" aria-labelledby="accountSheetTitle">
        <div class="account-sheet-handle" aria-hidden="true"></div>
        <header class="account-sheet-header">
          <div class="account-sheet-avatar" id="accountSheetAvatar" aria-hidden="true">TK</div>
          <div class="account-sheet-copy">
            <strong id="accountSheetTitle" data-ui-type="label">Tài khoản</strong>
            <span id="accountName" data-ui-type="panel-title">Tài khoản</span>
            <small id="accountHandle" data-ui-type="meta"></small>
          </div>
          <button class="account-sheet-close ui-icon-button" id="accountSheetClose" type="button" aria-label="Đóng">×</button>
        </header>
        <button class="account-logout ui-button ui-button-danger" id="accountLogout" type="button" data-ui-type="action">Đăng xuất</button>
      </section>
    </div>
    <div class="system-toast" id="systemToast" hidden></div>
  </section>
</div>
<script type="module" src="./src/core/ime-stability.js"></script>
<script type="module" src="./src/app.js"></script>
<script type="module" src="./src/core/ui-system.js"></script>
<script type="module" src="./src/core/scroll-owner.js"></script>
<script type="module" src="./src/core/app-update-bootstrap.js"></script>
</body>
</html>
