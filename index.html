<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="app-build-id" content="source-main">
<title>taphoa.xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/shell.css">
<link rel="stylesheet" href="./src/styles/taphoa-tailwind.css">
</head>
<body>
<div class="taphoa-viewport" id="taphoaViewport">
  <section class="login-screen" id="loginScreen">
    <div class="login-wrap">
      <form class="login-card" id="loginForm">
        <h1>Đăng nhập</h1>
        <input class="login-field" id="loginUsername" autocomplete="username" placeholder="Tên đăng nhập">
        <div class="login-password"><input class="login-field" id="loginPassword" type="password" autocomplete="current-password" placeholder="Mật khẩu"><span id="loginEye" hidden aria-hidden="true"></span></div>
        <label class="login-remember"><input id="loginRemember" type="checkbox">Nhớ tên đăng nhập</label>
        <div class="login-error" id="loginError" hidden></div>
        <button class="login-submit" id="loginSubmit" type="submit">Đăng nhập</button>
      </form>
    </div>
  </section>

  <section class="app-shell" id="appShell" hidden>
    <header class="app-topbar" id="appTopbar">
      <nav class="app-nav" id="appNav" aria-label="Điều hướng"></nav>
    </header>
    <main class="screen-host" id="screenHost"></main>
    <div class="app-status-bar" id="appStatusBar"><i class="ph-fill ph-check-circle" aria-hidden="true"></i><span>Hệ thống sẵn sàng</span></div>

    <button class="account-button" id="accountButton" type="button" aria-label="Tài khoản" aria-haspopup="dialog" aria-controls="accountSheet" hidden><span id="accountButtonInitials" aria-hidden="true">TK</span></button>
    <div id="accountSheet" class="account-sheet" hidden>
      <button class="account-sheet-backdrop" id="accountSheetBackdrop" type="button" aria-label="Đóng"></button>
      <section class="account-sheet-card" role="dialog" aria-modal="true" aria-labelledby="accountSheetTitle">
        <div class="account-sheet-handle" aria-hidden="true"></div>
        <header class="account-sheet-header">
          <div class="account-sheet-avatar" id="accountSheetAvatar" aria-hidden="true">TK</div>
          <div class="account-sheet-copy">
            <strong id="accountSheetTitle">Tài khoản</strong>
            <span id="accountName">Tài khoản</span>
            <small id="accountHandle"></small>
          </div>
          <button class="account-sheet-close" id="accountSheetClose" type="button" aria-label="Đóng">×</button>
        </header>
        <button class="account-logout" id="accountLogout" type="button">Đăng xuất</button>
      </section>
    </div>
    <div class="system-toast" id="systemToast" hidden></div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module" src="./src/core/ime-stability.js"></script>
<script type="module" src="./src/app.js"></script>
<script type="module" src="./src/core/ui-system.js"></script>
<script type="module" src="./src/core/app-update-bootstrap.js"></script>
</body>
</html>
