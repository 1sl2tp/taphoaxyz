<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<meta property="og:title" content="Đơn hàng TAPHOA">
<meta property="og:type" content="website">
<title>Đơn hàng TAPHOA</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#171717;background:#f6f7f8;font-size:16px;--stt:3.4ch;--price:5.4ch;--qty:3.4ch;--money:6.4ch;--gap:8px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f7f8;color:#171717}
body{padding:max(14px,env(safe-area-inset-top)) 0 max(14px,env(safe-area-inset-bottom))}
main{width:min(720px,100%);min-height:calc(100dvh - 28px);margin:0 auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #f1f5f9}.head-left{display:flex;align-items:center;gap:9px;min-width:0}.icon{width:32px;height:32px;border-radius:9px;background:#ecfdf3;color:#16a34a;display:flex;align-items:center;justify-content:center;flex:none}.icon svg{width:18px;height:18px}.head h1{margin:0;font-size:17px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{padding:12px 18px;background:#f8fafc;border-bottom:1px solid #f1f5f9}.code{font-size:11px;font-weight:600;color:#9ca3af}.customer{margin-top:4px;font-size:14px;font-weight:750;color:#1f2937}.time{margin-top:4px;font-size:11px;color:#6b7280}.note{margin-top:6px;font-size:11px;color:#6b7280}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}.grid{display:grid;width:100%;grid-template-columns:var(--stt) minmax(0,1fr) var(--price) var(--qty) var(--money);column-gap:var(--gap);align-items:center;min-width:0}.grid>*{min-width:0}.thead{position:sticky;top:0;z-index:2;padding:8px 14px;border-bottom:1px solid #f3f4f6;background:#fff;color:#9ca3af;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.04em}.stt{text-align:center;font-variant-numeric:tabular-nums}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.price,.qty,.total{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.items{padding:0 14px}.row{min-height:42px;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:12px;color:#374151}.row:last-child{border-bottom:0}.row .stt{font-weight:700;color:#9ca3af}.row .name{font-weight:750;color:#111827;line-height:1.3}.row .price{font-weight:600}.row .qty{font-weight:700}.row .total{font-weight:800;color:#111827}.line-note{margin-top:2px;font-size:10px;line-height:1.25;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary{padding:14px 18px 16px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex:none}.label{font-size:12px;font-weight:500;color:#9ca3af}.value{margin-top:3px;font-size:15px;font-weight:750;color:#111827}.sum{text-align:right}.sum .value{font-size:20px;font-weight:850;color:#16a34a;font-variant-numeric:tabular-nums;white-space:nowrap}.status{padding:30px 18px;text-align:center;color:#6b7280}.status strong{display:block;color:#111827;margin-bottom:6px}
[hidden]{display:none!important}
@media (min-width:760px){body{padding:24px}main{min-height:min(760px,calc(100dvh - 48px));max-height:min(760px,calc(100dvh - 48px));border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 16px 50px rgba(15,23,42,.08)}.thead,.items{padding-left:18px;padding-right:18px}}
</style>
</head>
<body>
<main>
  <div class="status" id="status">Đang tải đơn hàng…</div>
  <section id="order" hidden>
    <header class="head">
      <div class="head-left">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg></span>
        <h1 id="title">Chi tiết đơn</h1>
      </div>
    </header>
    <div class="meta">
      <div class="code" id="code">Mã đơn: --</div>
      <div class="customer" id="customer">Khách hàng</div>
      <div class="time" id="time">Thời gian: --</div>
      <div class="note" id="note" hidden></div>
    </div>
    <div class="scroll">
      <div class="grid thead">
        <div class="stt">#</div><div class="name">TÊN SP</div><div class="price">Đ.GIÁ</div><div class="qty">SL</div><div class="total">T.TIỀN</div>
      </div>
      <div class="items" id="items"></div>
    </div>
    <footer class="summary">
      <div><div class="label">Số lượng</div><div class="value"><span id="codes">0</span> mã · <span id="qty">0</span> sản phẩm</div></div>
      <div class="sum"><div class="label">Tổng thanh toán</div><div class="value" id="total">0</div></div>
    </footer>
  </section>
</main>
<script>
(()=>{
'use strict';
const API='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/taphoa-public-debt';
const params=new URLSearchParams(location.search);
const kh=params.get('kh')||'';
const don=(params.get('don')||'').toUpperCase();
const status=document.getElementById('status');
const order=document.getElementById('order');
const els={title:document.getElementById('title'),code:document.getElementById('code'),customer:document.getElementById('customer'),time:document.getElementById('time'),note:document.getElementById('note'),items:document.getElementById('items'),codes:document.getElementById('codes'),qty:document.getElementById('qty'),total:document.getElementById('total')};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:3}).format(Math.abs(Number(v)||0));
const qty=v=>{const n=Number(v)||0;return Number.isInteger(n)?String(n):String(n).replace(/0+$/,'').replace(/\.$/,'');};
function when(v){
  if(!v)return'--';
  const d=new Date(v);
  if(Number.isNaN(d.getTime()))return'--';
  const day=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][d.getDay()];
  const hm=d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false});
  const dm=d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
  return day+' · '+hm+' · '+dm;
}
function fail(){status.innerHTML='<strong>Không mở được đơn hàng</strong>Kiểm tra lại liên kết được gửi từ TAPHOA.';}
if(!kh||!/^(DG|DT)\d+$/i.test(don)){fail();return;}
fetch(API+'?kh='+encodeURIComponent(kh)+'&don='+encodeURIComponent(don),{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('load_failed');return r.json();})
  .then(data=>{
    if(!data?.ok||!data.order)throw new Error('invalid');
    const o=data.order,rows=Array.isArray(o.items)?o.items:[];
    let totalQty=0;
    els.title.textContent=o.display_code||don;
    els.code.textContent='Mã đơn: '+(o.display_code||don);
    els.customer.textContent=data.customer?.display_name||'Khách hàng';
    els.time.textContent='Thời gian: '+when(o.delivered_at||o.created_at);
    if(o.note){els.note.hidden=false;els.note.textContent='Ghi chú: '+o.note;}
    els.items.innerHTML=rows.map((item,index)=>{
      totalQty+=Number(item.qty)||0;
      return '<div class="grid row"><div class="stt">'+esc(index+1)+'</div><div><div class="name">'+esc(item.product_name||item.product_code||'Sản phẩm')+'</div>'+(item.note?'<div class="line-note">'+esc(item.note)+'</div>':'')+'</div><div class="price">'+esc(money(item.unit_price_vnd))+'</div><div class="qty">'+esc(qty(item.qty))+'</div><div class="total">'+esc(money(item.line_total_vnd))+'</div></div>';
    }).join('')||'<div class="status">Đơn không có sản phẩm.</div>';
    els.codes.textContent=String(rows.length);els.qty.textContent=qty(totalQty);els.total.textContent=money(o.total_vnd);
    document.title=(o.display_code||don)+' · TAPHOA';
    status.hidden=true;order.hidden=false;
  })
  .catch(fail);
})();
</script>
</body>
</html>
