<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0f172a">
  <title>Quản trị giá · Tạp hóa</title>
  <style>
    :root{color-scheme:light;--bg:#f1f5f9;--card:#fff;--line:#dbe3ec;--text:#0f172a;--muted:#64748b;--green:#16a34a;--green2:#15803d;--red:#dc2626;--blue:#2563eb;--shadow:0 12px 32px rgba(15,23,42,.08)}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Be Vietnam Pro",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .wrap{max-width:1180px;margin:0 auto;padding:20px}
    .top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
    .title h1{font-size:24px;margin:0}.title p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .actions{display:flex;gap:8px;align-items:center}
    .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px;font-weight:700}
    .btn.primary{background:var(--green);border-color:var(--green);color:white}
    .btn.primary:hover{background:var(--green2)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    .login{max-width:420px;margin:10vh auto;padding:24px}
    .login h2{margin:0 0 6px}.login p{margin:0 0 18px;color:var(--muted)}
    .field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:800;color:#475569}
    .field input,.field select,.tool input,.tool select,.price-input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);outline:none}
    .field input:focus,.tool input:focus,.tool select:focus,.price-input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
    .msg{min-height:20px;font-size:13px;color:var(--muted)}.msg.error{color:var(--red)}.msg.ok{color:var(--green2)}
    .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 220px auto;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
    .tool{display:grid;gap:5px}.tool label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .summary{display:flex;gap:14px;align-items:center;padding:10px 14px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
    .table-wrap{overflow:auto;max-height:calc(100vh - 245px)}
    table{width:100%;border-collapse:separate;border-spacing:0;min-width:860px}
    th{position:sticky;top:0;z-index:2;background:#f8fafc;text-align:left;font-size:12px;color:#475569;padding:10px;border-bottom:1px solid var(--line)}
    td{padding:10px;border-bottom:1px solid #eef2f7;vertical-align:middle}
    tr:hover td{background:#fbfdff}
    .code{font-weight:800;font-size:12px;color:#334155;white-space:nowrap}
    .name{font-weight:700;min-width:260px}.source{font-size:12px;color:var(--muted);white-space:nowrap}
    .price-input{min-width:120px;padding:8px 9px;text-align:right;font-weight:700}
    .profit{font-weight:800;text-align:right;white-space:nowrap}.profit.negative{color:var(--red)}
    .save-cell{width:92px;text-align:right}
    .row-save{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:8px 11px;font-weight:800}
    .row-save.saved{background:var(--green)}
    .row-status{font-size:11px;color:var(--muted);margin-top:4px;min-height:14px;text-align:right}
    .pager{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
    .pager .btn{min-width:86px}
    .empty{padding:36px;text-align:center;color:var(--muted)}
    .hidden{display:none!important}
    .badge{display:inline-flex;align-items:center;gap:6px;background:#ecfdf5;color:#166534;border:1px solid #bbf7d0;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    @media(max-width:720px){
      .wrap{padding:12px}.top{align-items:flex-start}.title h1{font-size:20px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .tool:last-child{grid-column:1/-1}
      .table-wrap{max-height:calc(100vh - 275px)}.actions .btn:first-child{display:none}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="loginView" class="panel login hidden">
      <h2>Quản trị giá</h2>
      <p>Đăng nhập tài khoản quản trị Tạp hóa.</p>
      <form id="loginForm">
        <div class="field"><label>Tài khoản</label><input id="username" autocomplete="username" required></div>
        <div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" type="submit" style="width:100%">Đăng nhập</button>
        <div id="loginMsg" class="msg"></div>
      </form>
    </section>

    <section id="appView" class="hidden">
      <div class="top">
        <div class="title">
          <h1>Quản trị giá</h1>
          <p>Sửa trực tiếp Supabase · không đọc/ghi Google Sheet</p>
        </div>
        <div class="actions">
          <a class="btn" href="./">Bán hàng</a>
          <button id="logoutBtn" class="btn" type="button">Đăng xuất</button>
        </div>
      </div>

      <section class="panel">
        <div class="toolbar">
          <div class="tool">
            <label>Tìm sản phẩm</label>
            <input id="searchInput" placeholder="Mã hoặc tên sản phẩm…" autocomplete="off">
          </div>
          <div class="tool">
            <label>Nguồn</label>
            <select id="sourceSelect"><option value="">Tất cả nguồn</option></select>
          </div>
          <div class="tool">
            <label>Trạng thái</label>
            <div class="badge"><span class="dot"></span><span id="statusText">Supabase trực tiếp</span></div>
          </div>
        </div>

        <div class="summary">
          <span id="countText">Đang tải…</span>
          <span>•</span>
          <span>Giá nhập theo đơn vị đang dùng trong hệ thống (ví dụ 628 = 628 nghìn)</span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Mã</th>
                <th>Tên sản phẩm</th>
                <th>Nguồn</th>
                <th style="text-align:right">Giá vốn</th>
                <th style="text-align:right">Giá bán</th>
                <th style="text-align:right">Lãi</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="productBody"></tbody>
          </table>
          <div id="emptyState" class="empty hidden">Không tìm thấy sản phẩm.</div>
        </div>

        <div class="pager">
          <button id="prevBtn" class="btn" type="button">← Trước</button>
          <span id="pageText" class="msg"></span>
          <button id="nextBtn" class="btn" type="button">Sau →</button>
        </div>
      </section>
    </section>
  </main>

  <script type="module">
    import {createAuthService} from './src/core/auth.js';

    const auth=createAuthService();
    const PAGE_SIZE=80;
    let identity=null;
    let client=null;
    let items=[];
    let total=0;
    let offset=0;
    let loading=false;
    let searchTimer=0;

    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const plain=value=>value===null||value===undefined?'':String(value);
    const n=value=>{const v=Number(String(value??'').replace(',','.'));return Number.isFinite(v)?v:null};
    const pretty=value=>value===null||value===undefined||value===''?'—':Number(value).toLocaleString('vi-VN',{maximumFractionDigits:2});

    function setLoginMessage(text='',kind=''){
      const el=$('loginMsg');el.textContent=text;el.className='msg'+(kind?' '+kind:'');
    }
    function showLogin(message=''){
      $('appView').classList.add('hidden');
      $('loginView').classList.remove('hidden');
      if(message)setLoginMessage(message,'error');
    }
    function showApp(){
      $('loginView').classList.add('hidden');
      $('appView').classList.remove('hidden');
    }
    async function rpc(name,args={}){
      if(!client)client=await auth.getClient();
      const {data,error}=await client.rpc(name,args);
      if(error)throw error;
      return data;
    }
    async function enter(info){
      identity=info?.identity||null;
      if(!identity||identity.active!==true)return showLogin('Tài khoản không có quyền vào Tạp hóa.');
      if(identity.role!=='admin'){
        await auth.logout().catch(()=>{});
        identity=null;client=null;
        return showLogin('Trang này chỉ dành cho quản trị.');
      }
      client=info.client||await auth.getClient();
      showApp();
      await loadPage(true);
    }

    async function loadPage(reset=false){
      if(loading)return;
      if(reset)offset=0;
      loading=true;
      $('statusText').textContent='Đang tải…';
      $('prevBtn').disabled=true;$('nextBtn').disabled=true;
      try{
        const data=await rpc('taphoa_admin_price_catalog',{
          p_query:$('searchInput').value.trim(),
          p_source:$('sourceSelect').value,
          p_limit:PAGE_SIZE,
          p_offset:offset
        });
        items=Array.isArray(data?.items)?data.items:[];
        total=Number(data?.total)||0;
        fillSources(Array.isArray(data?.sources)?data.sources:[]);
        render();
        $('statusText').textContent='Supabase trực tiếp';
      }catch(error){
        console.error(error);
        $('statusText').textContent='Lỗi tải dữ liệu';
        $('countText').textContent='Không tải được dữ liệu';
      }finally{
        loading=false;
        updatePager();
      }
    }

    function fillSources(sources){
      const select=$('sourceSelect');
      const current=select.value;
      const options=['<option value="">Tất cả nguồn</option>'];
      for(const s of sources)options.push(`<option value="${esc(s.source_key)}">${esc(s.name||s.source_key)}</option>`);
      select.innerHTML=options.join('');
      if([...select.options].some(o=>o.value===current))select.value=current;
    }

    function render(){
      const body=$('productBody');
      $('emptyState').classList.toggle('hidden',items.length!==0);
      body.innerHTML=items.map((item,index)=>{
        const profit=(item.price===null||item.cost===null)?null:Number(item.price)-Number(item.cost);
        return `<tr data-index="${index}" data-code="${esc(item.product_code)}">
          <td class="code">${esc(item.product_code)}</td>
          <td class="name">${esc(item.product_name)}</td>
          <td class="source">${esc(item.source_name||item.source_key)}</td>
          <td><input class="price-input cost-input" inputmode="decimal" value="${esc(plain(item.cost))}" aria-label="Giá vốn ${esc(item.product_code)}"></td>
          <td><input class="price-input sale-input" inputmode="decimal" value="${esc(plain(item.price))}" aria-label="Giá bán ${esc(item.product_code)}"></td>
          <td class="profit ${profit!==null&&profit<0?'negative':''}">${pretty(profit)}</td>
          <td class="save-cell"><button class="row-save" type="button">Lưu</button><div class="row-status"></div></td>
        </tr>`;
      }).join('');
      $('countText').textContent=total?`Hiển thị ${offset+1}–${Math.min(offset+items.length,total)} / ${total} sản phẩm`:'0 sản phẩm';
    }

    function updatePager(){
      $('prevBtn').disabled=loading||offset<=0;
      $('nextBtn').disabled=loading||offset+PAGE_SIZE>=total;
      const page=Math.floor(offset/PAGE_SIZE)+1;
      const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
      $('pageText').textContent=`Trang ${page}/${pages}`;
    }

    async function saveRow(row){
      const index=Number(row.dataset.index);
      const item=items[index];
      if(!item)return;
      const button=row.querySelector('.row-save');
      const status=row.querySelector('.row-status');
      const costRaw=row.querySelector('.cost-input').value.trim();
      const priceRaw=row.querySelector('.sale-input').value.trim();
      const cost=costRaw===''?null:n(costRaw);
      const price=priceRaw===''?null:n(priceRaw);
      if((costRaw!==''&&cost===null)||(priceRaw!==''&&price===null)){
        status.textContent='Giá không hợp lệ';status.style.color='#dc2626';return;
      }
      button.disabled=true;button.textContent='Đang lưu…';status.textContent='';
      try{
        const result=await rpc('taphoa_update_product_from_web',{
          p_product:{product_code:item.product_code,cost,price}
        });
        item.cost=result?.cost??cost;
        item.price=result?.price??price;
        const profit=(item.price===null||item.cost===null)?null:Number(item.price)-Number(item.cost);
        const profitCell=row.querySelector('.profit');
        profitCell.textContent=pretty(profit);
        profitCell.classList.toggle('negative',profit!==null&&profit<0);
        button.textContent='Đã lưu';button.classList.add('saved');
        status.textContent=result?.changed===false?'Không đổi':'Đã cập nhật';
        status.style.color='#15803d';
        setTimeout(()=>{button.textContent='Lưu';button.classList.remove('saved');},1200);
      }catch(error){
        console.error(error);
        button.textContent='Lưu';
        status.textContent=String(error?.message||'Không lưu được').slice(0,80);
        status.style.color='#dc2626';
      }finally{
        button.disabled=false;
      }
    }

    $('loginForm').addEventListener('submit',async event=>{
      event.preventDefault();
      setLoginMessage('Đang đăng nhập…');
      try{
        const info=await auth.login($('username').value,$('password').value);
        setLoginMessage('');
        await enter(info);
      }catch(error){
        setLoginMessage(error?.message||'Không đăng nhập được','error');
      }
    });
    $('logoutBtn').addEventListener('click',async()=>{
      await auth.logout().catch(()=>{});
      identity=null;client=null;items=[];total=0;offset=0;
      showLogin();
    });
    $('productBody').addEventListener('click',event=>{
      const button=event.target.closest('.row-save');
      if(button)saveRow(button.closest('tr'));
    });
    $('productBody').addEventListener('keydown',event=>{
      if(event.key==='Enter'&&event.target.classList.contains('price-input')){
        event.preventDefault();saveRow(event.target.closest('tr'));
      }
    });
    $('searchInput').addEventListener('input',()=>{
      clearTimeout(searchTimer);
      searchTimer=setTimeout(()=>loadPage(true),240);
    });
    $('sourceSelect').addEventListener('change',()=>loadPage(true));
    $('prevBtn').addEventListener('click',()=>{offset=Math.max(0,offset-PAGE_SIZE);loadPage(false)});
    $('nextBtn').addEventListener('click',()=>{if(offset+PAGE_SIZE<total){offset+=PAGE_SIZE;loadPage(false)}});

    try{
      const restored=await auth.restore();
      if(restored)await enter(restored);
      else showLogin();
    }catch(error){
      console.error(error);showLogin('Không khôi phục được phiên đăng nhập.');
    }
  </script>
</body>
</html>
