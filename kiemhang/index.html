<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<meta name="robots" content="noindex,nofollow">
<title>Nhân viên · TAPHOA</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#171717;background:#f3f4f6}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:20px;background:#f3f4f6}
.card{width:min(380px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px;box-shadow:0 12px 36px rgba(15,23,42,.08)}
h1{margin:0;font-size:20px}p{margin:7px 0 18px;color:#667085;font-size:13px;line-height:1.5}
.pin-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pin-digit{width:100%;min-width:0;height:52px;padding:0;border:1px solid #d0d5dd;border-radius:12px;background:#fff;text-align:center;font-size:22px;font-weight:800;line-height:1;color:#111827;caret-color:#111827;outline:none}
.pin-digit:focus{border-color:#111827;box-shadow:0 0 0 2px rgba(17,24,39,.08)}
.pin-grid[data-invalid="true"] .pin-digit{border-color:#f04438;background:#fffafa}
.pin-grid[data-complete="true"] .pin-digit{border-color:#98a2b3}
button{width:100%;height:48px;margin-top:12px;border:0;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.42;cursor:default}.primary{background:#171717;color:#fff}.secondary{background:#f3f4f6;color:#344054}
.error{min-height:18px;margin-top:10px;color:#b42318;font-size:12px;text-align:center}
.hidden{display:none!important}
@media(max-width:340px){.pin-grid{gap:6px}.pin-digit{height:48px;font-size:20px}}
</style>
</head>
<body>
<section class="card">
  <h1 id="title">Nhập mã PIN</h1>
  <p id="description">Nhập PIN do chủ cửa hàng cung cấp để mở giao diện Nhân viên.</p>
  <div id="pinPanel">
    <div class="pin-grid" id="pinGrid" data-invalid="false" data-complete="false" aria-label="Mã PIN 6 số">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Số PIN 1">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 2">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 3">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 4">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 5">
      <input class="pin-digit" data-pin-digit inputmode="numeric" autocomplete="off" maxlength="1" aria-label="Số PIN 6">
    </div>
    <button id="submit" class="primary" type="button" disabled>Tiếp tục</button>
  </div>
  <button id="retry" class="secondary hidden" type="button">Thử lại</button>
  <div class="error" id="error"></div>
</section>

<script>
(()=>{
'use strict';

const API='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/taphoa-stock-check';
const STORE='taphoa.employee.link.v1';
const token=String(new URLSearchParams(location.search).get('t')||'').trim();
const title=document.getElementById('title');
const description=document.getElementById('description');
const pinPanel=document.getElementById('pinPanel');
const pinGrid=document.getElementById('pinGrid');
const pinInputs=[...pinGrid.querySelectorAll('[data-pin-digit]')];
const submit=document.getElementById('submit');
const retry=document.getElementById('retry');
const error=document.getElementById('error');

let busy=false;
try{sessionStorage.removeItem(STORE);}catch{}

function setError(message=''){error.textContent=message;}
function getPinValue(){return pinInputs.map(input=>String(input.value||'').replace(/\D/g,'').slice(-1)).join('');}
function updatePinState(){
  const value=getPinValue();
  pinGrid.dataset.complete=String(value.length===6);
  if(value.length)pinGrid.dataset.invalid='false';
  submit.disabled=busy||value.length!==6;
}
function clearPin({invalid=false}={}){
  pinInputs.forEach(input=>{input.value='';});
  pinGrid.dataset.invalid=String(invalid);
  updatePinState();
}
function focusPin(index=0){setTimeout(()=>pinInputs[Math.max(0,Math.min(5,index))]?.focus(),0);}
function fillPinDigits(digits,startIndex=0){
  const values=String(digits||'').replace(/\D/g,'');
  if(!values)return;
  const start=values.length>=6?0:startIndex;
  for(let i=0;i<values.length&&start+i<pinInputs.length;i++)pinInputs[start+i].value=values[i];
  setError('');
  updatePinState();
  focusPin(Math.min(start+values.length,pinInputs.length-1));
}
function wirePinInputs(){
  pinInputs.forEach((input,index)=>{
    input.addEventListener('input',()=>{
      const digits=String(input.value||'').replace(/\D/g,'');
      input.value=digits.slice(-1);
      pinGrid.dataset.invalid='false';
      setError('');
      updatePinState();
      if(input.value&&index<pinInputs.length-1)pinInputs[index+1].focus();
    });
    input.addEventListener('keydown',event=>{
      if(event.key==='Backspace'&&!input.value&&index>0){
        event.preventDefault();
        pinInputs[index-1].value='';
        pinInputs[index-1].focus();
        updatePinState();
      }else if(event.key==='ArrowLeft'&&index>0){
        event.preventDefault();pinInputs[index-1].focus();
      }else if(event.key==='ArrowRight'&&index<pinInputs.length-1){
        event.preventDefault();pinInputs[index+1].focus();
      }else if(event.key==='Enter'&&getPinValue().length===6){
        event.preventDefault();void enter();
      }
    });
    input.addEventListener('paste',event=>{
      const digits=String(event.clipboardData?.getData('text')||'').replace(/\D/g,'');
      if(!digits)return;
      event.preventDefault();
      fillPinDigits(digits,index);
    });
  });
}
function setBusy(value){
  busy=value;
  submit.textContent=value?'Đang kiểm tra…':'Tiếp tục';
  updatePinState();
}
function showMissingOwnerPin(){
  title.textContent='Chưa có mã PIN';
  description.textContent='Chủ cửa hàng chưa tạo PIN cho link Nhân viên. Hãy hỏi chủ tạo PIN rồi thử lại.';
  pinPanel.classList.add('hidden');
  retry.classList.remove('hidden');
  setError('');
}
function showPin(message='Nhập PIN do chủ cửa hàng cung cấp để mở giao diện Nhân viên.'){
  title.textContent='Nhập mã PIN';
  description.textContent=message;
  pinPanel.classList.remove('hidden');
  retry.classList.add('hidden');
  clearPin();
  setError('');
  focusPin();
}
function fail(){
  title.textContent='Liên kết không hợp lệ';
  description.textContent='Không mở được link Nhân viên.';
  pinPanel.classList.add('hidden');
  retry.classList.add('hidden');
  setError('');
}
async function checkPin(value=''){
  const headers={};
  if(value)headers['x-employee-pin']=value;
  const res=await fetch(API+'?t='+encodeURIComponent(token),{cache:'no-store',headers});
  const data=await res.json().catch(()=>({}));
  return {res,data};
}
async function probe(){
  if(!token){fail();return;}
  try{
    const {res,data}=await checkPin('');
    if(res.ok&&data?.ok){showPin();return;}
    const code=String(data?.error||'');
    if(code==='owner_pin_not_set'){showMissingOwnerPin();return;}
    if(code==='pin_required'||code==='pin_invalid'){showPin();return;}
    if(code==='pin_locked'){showPin('PIN đang tạm khóa do nhập sai nhiều lần. Hãy chờ một lúc rồi thử lại.');return;}
    fail();
  }catch{fail();}
}
async function enter(){
  const value=getPinValue();
  if(!/^\d{6}$/.test(value)){setError('PIN gồm đúng 6 chữ số.');return;}
  setBusy(true);setError('');
  try{
    const {res,data}=await checkPin(value);
    if(!res.ok||data?.ok!==true){
      const code=String(data?.error||'');
      if(code==='owner_pin_not_set'){showMissingOwnerPin();return;}
      if(code==='pin_locked'){setError('PIN đang tạm khóa. Hãy thử lại sau.');return;}
      setError('PIN không đúng. Hãy hỏi lại chủ cửa hàng.');
      clearPin({invalid:true});
      focusPin();
      return;
    }
    if(String(data?.role||'')!=='employee'){fail();return;}
    sessionStorage.setItem(STORE,JSON.stringify({token,pin:value}));
    location.replace('/?employee=1&t='+encodeURIComponent(token));
  }catch{
    setError('Không kiểm tra được PIN. Vui lòng thử lại.');
  }finally{
    setBusy(false);
  }
}

wirePinInputs();
submit.addEventListener('click',()=>void enter());
retry.addEventListener('click',()=>void probe());

void probe();
})();
</script>
</body>
</html>
